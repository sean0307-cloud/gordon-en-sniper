<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Gordon閃卡" />
  <title>🌿 Gordon 專屬英文分週進度閃卡系統</title>
  <style>
    :root {
      --bg: #F5F4EF;
      --card: #FFFFFF;
      --text: #2C3539;
      --text-sub: #64748B;
      --primary: #2563EB;
      --primary-dark: #1E3A8A;
      --primary-light: #EFF6FF;
      --green: #2E7D5B;
      --green-light: #E8F5EE;
      --amber: #C27803;
      --amber-light: #FEF6E7;
      --red: #C84B31;
      --red-light: #FDF0ED;
      --border: #E2E0D8;
      --shadow: 0 8px 24px rgba(44, 53, 57, 0.06);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.55;
      padding: 12px 14px 36px;
      max-width: 520px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Minimal Top Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .app-title {
      font-size: 1.02rem;
      font-weight: 800;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .sync-pill {
      font-size: 0.74rem;
      padding: 4px 10px;
      border-radius: 99px;
      background: var(--green-light);
      color: var(--green);
      font-weight: 700;
      cursor: pointer;
    }

    /* =========================================================================
       CLEAN, COMFORTABLE SINGLE-BAR DROPDOWN SELECTOR
       ========================================================================= */
    .dropdown-card {
      background: var(--card);
      border: 1.5px solid #CBD5E1;
      border-radius: 14px;
      padding: 9px 12px;
      margin-bottom: 10px;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.03);
    }
    .dropdown-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 5px;
    }
    .dropdown-label {
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--text-sub);
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .isolated-tag {
      font-size: 0.68rem;
      background: var(--primary-light);
      color: var(--primary-dark);
      padding: 1px 7px;
      border-radius: 99px;
      font-weight: 700;
    }
    .select-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    .pack-select {
      width: 100%;
      appearance: none;
      -webkit-appearance: none;
      background: #F8FAFC;
      border: 1.5px solid #93C5FD;
      border-radius: 10px;
      padding: 9px 34px 9px 12px;
      font-size: 0.92rem;
      font-weight: 800;
      color: var(--primary-dark);
      cursor: pointer;
      outline: none;
      transition: border-color 0.15s, background 0.15s;
    }
    .pack-select:focus {
      border-color: var(--primary);
      background: #FFFFFF;
    }
    .select-arrow {
      position: absolute;
      right: 12px;
      pointer-events: none;
      font-size: 0.85rem;
      color: var(--primary-dark);
      font-weight: 900;
    }

    /* Mode Switcher Bar (4 Clean Tabs) */
    .mode-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      background: #EAE8E0;
      padding: 4px;
      border-radius: 12px;
      margin-bottom: 9px;
    }
    .mode-btn {
      border: none;
      background: transparent;
      color: var(--text-sub);
      padding: 7px 4px;
      border-radius: 9px;
      font-size: 0.76rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
    }
    .mode-btn.active {
      background: var(--card);
      color: var(--text);
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }
    .mode-count {
      font-size: 0.95rem;
      font-weight: 800;
    }

    /* Category Pill Filter Row */
    .cat-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      margin-bottom: 10px;
      scrollbar-width: none;
    }
    .cat-bar::-webkit-scrollbar { display: none; }
    .cat-pill {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text-sub);
      padding: 5px 11px;
      border-radius: 99px;
      font-size: 0.77rem;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
    }
    .cat-pill.active {
      background: var(--text);
      color: #FFFFFF;
      border-color: var(--text);
    }

    /* Progress Bar + Quick Restart Link */
    .progress-wrap {
      margin-bottom: 10px;
    }
    .progress-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.78rem;
      color: var(--text-sub);
      font-weight: 700;
      margin-bottom: 4px;
    }
    .mini-restart-btn {
      border: none;
      background: transparent;
      color: var(--primary);
      font-size: 0.75rem;
      font-weight: 800;
      cursor: pointer;
      text-decoration: underline;
      margin-left: 6px;
    }
    .progress-track {
      height: 7px;
      background: #E2E0D8;
      border-radius: 99px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--primary);
      border-radius: 99px;
      transition: width 0.3s ease;
    }

    /* ONE-CARD-AT-A-TIME FOCUS STAGE */
    .card-stage {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 20px 18px;
      box-shadow: var(--shadow);
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 400px;
    }

    .card-meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .meta-tag {
      font-size: 0.75rem;
      font-weight: 800;
      padding: 3px 10px;
      border-radius: 99px;
      background: var(--primary-light);
      color: var(--primary-dark);
    }
    .status-tag {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-sub);
    }

    /* Word Hero Display */
    .word-hero {
      text-align: center;
      padding: 14px 8px 18px;
      border-bottom: 1px solid #F0EFEA;
      margin-bottom: 14px;
    }
    .word-main {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--text);
      letter-spacing: 0.3px;
      line-height: 1.25;
      margin-bottom: 8px;
      word-break: break-word;
    }
    .word-syllable {
      font-size: 1rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 12px;
    }
    .audio-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--primary-light);
      color: var(--primary-dark);
      border: 1px solid #BFDBFE;
      padding: 7px 16px;
      border-radius: 99px;
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
    }
    .audio-btn:active { transform: scale(0.96); }

    /* STEP 1: Micro-Test Options (Anti-Blind-Click Gate) */
    .gate-title {
      font-size: 0.82rem;
      color: var(--text-sub);
      font-weight: 700;
      margin-bottom: 8px;
      text-align: center;
    }
    .opt-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .opt-btn {
      width: 100%;
      background: #FAF9F6;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 11px 14px;
      text-align: left;
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      transition: all 0.12s;
    }
    .opt-btn:hover { border-color: var(--primary); background: #FFFFFF; }
    .opt-btn:active { transform: scale(0.99); }

    .unsure-btn {
      margin-top: 8px;
      width: 100%;
      background: transparent;
      border: 1px dashed #CBD5E1;
      border-radius: 10px;
      padding: 8px;
      font-size: 0.8rem;
      color: var(--text-sub);
      font-weight: 600;
      cursor: pointer;
    }

    /* STEP 2: Revealed Back Explanation & Consequence Buttons */
    .reveal-box {
      display: none;
      animation: fadeIn 0.2s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .result-banner {
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 800;
      margin-bottom: 10px;
      text-align: center;
    }
    .result-banner.pass {
      background: var(--green-light);
      color: var(--green);
      border: 1px solid #B7E1CD;
    }
    .result-banner.fail {
      background: var(--amber-light);
      color: var(--amber);
      border: 1px solid #F6D8A6;
    }

    .meaning-title {
      font-size: 1.12rem;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 8px;
      text-align: center;
    }
    .hack-card {
      background: #F8FAFC;
      border-left: 4px solid var(--primary);
      padding: 9px 12px;
      border-radius: 0 10px 10px 0;
      font-size: 0.87rem;
      color: var(--text);
      margin-bottom: 9px;
    }
    .example-line {
      font-size: 0.82rem;
      color: var(--text-sub);
      background: #F5F4EF;
      padding: 8px 10px;
      border-radius: 8px;
      margin-bottom: 12px;
    }

    /* Consequence Action Buttons */
    .action-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .conseq-btn {
      width: 100%;
      border-radius: 12px;
      padding: 11px 14px;
      border: 1.5px solid transparent;
      cursor: pointer;
      text-align: left;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: transform 0.1s;
    }
    .conseq-btn:active { transform: scale(0.98); }
    .c-main { font-size: 0.9rem; font-weight: 800; display: block; }
    .c-sub { font-size: 0.74rem; opacity: 0.85; display: block; margin-top: 2px; }
    .c-arrow { font-size: 1.1rem; font-weight: 800; }

    .btn-seal {
      background: var(--green-light);
      border-color: #9CD6B8;
      color: #1B5E3F;
    }
    .btn-keep {
      background: var(--amber-light);
      border-color: #F3CC8A;
      color: #8C5400;
    }
    .btn-sos {
      background: var(--red-light);
      border-color: #F2B8AC;
      color: #962D17;
    }

    /* =========================================================================
       COMPLETION / RESTART REVIEW CARD UI
       ========================================================================= */
    .complete-stage {
      justify-content: center;
      align-items: center;
      text-align: center;
      min-height: 360px;
      padding: 24px 18px;
    }
    .complete-icon {
      font-size: 2.6rem;
      margin-bottom: 8px;
    }
    .complete-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 6px;
    }
    .complete-desc {
      font-size: 0.84rem;
      color: var(--text-sub);
      margin-bottom: 18px;
      max-width: 380px;
    }
    .restart-btn-group {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }
    .restart-primary-btn {
      width: 100%;
      padding: 13px 16px;
      border-radius: 12px;
      border: none;
      background: var(--primary);
      color: #FFFFFF;
      font-size: 0.94rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.22);
      transition: transform 0.1s;
    }
    .restart-primary-btn:active { transform: scale(0.98); }
    .restart-secondary-btn {
      width: 100%;
      padding: 11px 14px;
      border-radius: 12px;
      border: 1.5px solid var(--border);
      background: #FAF9F6;
      color: var(--text);
      font-size: 0.86rem;
      font-weight: 700;
      cursor: pointer;
    }
    .restart-secondary-btn:active { transform: scale(0.98); }

    /* Bottom Card Navigation (Prev / Next) */
    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .nav-btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text-sub);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
    }

    /* Report View */
    .report-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: var(--shadow);
    }
    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 10px 0 14px;
    }
    .stat-item {
      background: #F8F7F3;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }
    .stat-item-val { font-size: 1.15rem; font-weight: 800; color: var(--primary); }
    .stat-item-lbl { font-size: 0.75rem; color: var(--text-sub); }

    .pack-breakdown-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 7px 10px;
      background: #FAF9F6;
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 6px;
      font-size: 0.82rem;
    }

    .full-btn {
      width: 100%;
      padding: 11px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      margin-bottom: 8px;
      text-align: center;
    }
    .full-btn.primary {
      background: var(--primary);
      color: #FFFFFF;
      border-color: var(--primary);
    }

    #toast {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      background: #2C3539;
      color: #FFFFFF;
      padding: 10px 16px;
      border-radius: 99px;
      font-size: 0.82rem;
      font-weight: 700;
      box-shadow: 0 6px 20px rgba(0,0,0,0.2);
      display: none;
      z-index: 999;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="app-title">🌿 Gordon 分週進度閃卡</div>
    <div id="sync-status" class="sync-pill" onclick="forceSync(true)">☁️ 自動同步中</div>
  </div>

  <!-- =========================================================================
       CLEAN SINGLE-BAR DROPDOWN PROGRESS SELECTOR (Grouped & Scalable)
       ========================================================================= -->
  <div class="dropdown-card">
    <div class="dropdown-top-row">
      <span class="dropdown-label">📅 選擇考試進度（點下拉選單切換）</span>
      <span class="isolated-tag">各週獨立題庫 · 不混題</span>
    </div>
    <div class="select-wrapper">
      <select id="pack-select" class="pack-select" onchange="onPackSelectChange(this.value)">
        <optgroup label="📌 本週最新考試進度（預設）">
          <option value="lichi_1108" id="opt-lichi_1108" selected>🔥 李奇 11/08 小考｜全範圍 (0/92 已封印)</option>
        </optgroup>
        <optgroup label="🎯 考後錯題攻堅專區">
          <option value="lichi_1101x" id="opt-lichi_1101x">🎯 李奇 11/01 考後｜錯題＋圈字 (0/23 已封印)</option>
        </optgroup>
        <optgroup label="📅 歷屆李奇小考進度（由新到舊）">
          <option value="lichi_1101" id="opt-lichi_1101">📅 李奇 11/01 考前｜9000單A+片語L6 (0/28 已封印)</option>
          <option value="lichi_1025" id="opt-lichi_1025">📅 李奇 10/25 小考｜新聞長字與完成式 (0/16 已封印)</option>
          <option value="lichi_1018" id="opt-lichi_1018">📅 李奇 10/18 小考｜無被動與片語搭配 (0/12 已封印)</option>
        </optgroup>
        <optgroup label="🏫 學校段考專區">
          <option value="midterm1" id="opt-midterm1">🏫 台中一中 一段｜核心語塊與詞性 (0/12 已封印)</option>
        </optgroup>
        <optgroup label="📚 考前跨週大複習">
          <option value="all" id="opt-all">📚 跨週全部進度總複習 (0/183 已封印)</option>
        </optgroup>
      </select>
      <span class="select-arrow">▾</span>
    </div>
  </div>

  <!-- 4 Clean Mode Tabs (Counts apply strictly to the selected week!) -->
  <div class="mode-bar">
    <button class="mode-btn active" id="m-todo" onclick="switchMode('todo')">
      <span class="mode-count" id="num-todo">0</span>
      <span>🔥 待消滅</span>
    </button>
    <button class="mode-btn" id="m-sos" onclick="switchMode('sos')">
      <span class="mode-count" id="num-sos" style="color: var(--red);">0</span>
      <span>🛏️ 睡前急救</span>
    </button>
    <button class="mode-btn" id="m-mastered" onclick="switchMode('mastered')">
      <span class="mode-count" id="num-mastered" style="color: var(--green);">0</span>
      <span>😎 已封印</span>
    </button>
    <button class="mode-btn" id="m-report" onclick="switchMode('report')">
      <span class="mode-count">📊</span>
      <span>學習紀錄</span>
    </button>
  </div>

  <!-- One-Tap Category Pills within the Selected Week -->
  <div class="cat-bar" id="filter-bar">
    <button class="cat-pill active" id="cat-all" onclick="selectCat('all')">🎯 本進度全部</button>
    <button class="cat-pill" id="cat-phonics" onclick="selectCat('phonics')">🔤 單字與音節</button>
    <button class="cat-pill" id="cat-chunks" onclick="selectCat('chunks')">🔗 必考片語</button>
    <button class="cat-pill" id="cat-roots" onclick="selectCat('roots')">⚠️ 熟詞生義/字根</button>
    <button class="cat-pill" id="cat-grammar" onclick="selectCat('grammar')">⚡ 文法秒殺</button>
  </div>

  <!-- MAIN SINGLE-CARD STAGE -->
  <div id="deck-view">
    <div class="progress-wrap">
      <div class="progress-info">
        <span id="deck-label">目前範圍：李奇 11/01 · 🔥 待消滅</span>
        <span>
          <span id="deck-counter">第 1 / 1 張</span>
          <button class="mini-restart-btn" id="top-restart-btn" onclick="confirmRestartPack()" style="display: none;">🔄 重刷本進度</button>
        </span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="deck-progress" style="width: 0%;"></div>
      </div>
    </div>

    <div id="single-card-mount"></div>

    <div class="nav-bar" id="nav-bar">
      <button class="nav-btn" onclick="stepCard(-1)">⬅️ 上一張</button>
      <span style="font-size: 0.75rem; color: var(--text-sub); font-weight: 600;">選對意思才可解鎖「😎 封印」</span>
      <button class="nav-btn" onclick="stepCard(1)">下一張 ➡️</button>
    </div>
  </div>

  <!-- REPORT & AI SYNC VIEW -->
  <div id="report-view" style="display: none;">
    <div class="report-card">
      <h3 style="font-size: 1rem; margin-bottom: 4px;">📊 分週進度熟練度 ＆ 防亂點報告</h3>
      <p style="font-size: 0.78rem; color: var(--text-sub); margin-bottom: 10px;">
        系統獨立統計每一週考試進度的完成率、首次點擊正確率與睡前急救清單。
      </p>
      <div id="pack-breakdown-list" style="margin-bottom: 12px;"></div>
      <div class="stat-grid" id="report-metrics"></div>
      <div id="sos-word-list" style="font-size: 0.83rem; background: #FAF9F6; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); margin-bottom: 12px;"></div>

      <button class="full-btn primary" onclick="forceSync(true)">☁️ 立即同步最新紀錄至雲端</button>
      <button class="full-btn" onclick="copyReport()">📋 複製學習戰報文字 (傳給爸媽 / AI)</button>
      <button class="full-btn" onclick="downloadCSV()">📥 下載 Excel 試算表紀錄 (.csv)</button>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    // ============================================================================
    // 1. FLASHCARD DATABASE (Separated cleanly by Weekly Exam Pack)
    // ============================================================================

    // ============================================================================
    // 2. STATE & WEEKLY PACK ISOLATION ENGINE
    // ============================================================================
    const STORAGE_KEY = "gordon_en_sniper_state_v2";
    const CLOUD_TOPIC = "gordon_en_sniper_d72b5fa7";

    let appState = {
      student: "Gordon",
      lastUpdated: new Date().toISOString(),
      stats: { totalAttempts: 0, firstTryCorrect: 0, fastClickWarnings: 0 },
      cards: {}
    };

    // DEFAULT TO THIS WEEK'S PACK ('lichi_1101')
    let currentPack = "lichi_1108";
    let currentCat = "all";
    let currentMode = "todo"; // 'todo' | 'sos' | 'mastered' | 'report'
    let filteredDeck = [];
    let currentIndex = 0;
    let cardShownTime = 0;

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          appState = { ...appState, ...parsed };
          if (!appState.stats) appState.stats = { totalAttempts: 0, firstTryCorrect: 0, fastClickWarnings: 0 };
        }
      } catch (e) {}

      CARDS_DB.forEach(c => {
        if (!appState.cards[c.id]) {
          appState.cards[c.id] = { status: "new", errCount: 0, passCount: 0, avgMs: 0, updatedAt: "" };
        }
      });
    }

    function saveState(syncCloud = true) {
      appState.lastUpdated = new Date().toISOString();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
      updatePackAndModeCounts();
      if (syncCloud) triggerCloudSync();
    }

    let syncTimer = null;
    function triggerCloudSync() {
      const pill = document.getElementById("sync-status");
      pill.innerText = "🔄 同步中...";
      if (syncTimer) clearTimeout(syncTimer);
      syncTimer = setTimeout(async () => {
        try {
          const payload = buildSyncPayload();
          await fetch(`https://ntfy.sh/${CLOUD_TOPIC}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
          pill.innerText = "☁️ 雲端已同步";
        } catch (e) {
          pill.innerText = "💾 已存手機";
        }
      }, 500);
    }

    function buildSyncPayload() {
      const summary = { mastered: [], review: [], sos: [], errCards: {}, byPack: {} };
      ["lichi_1108", "lichi_1101x", "lichi_1101", "lichi_1025", "lichi_1018", "midterm1"].forEach(pk => {
        summary.byPack[pk] = { total: 0, mastered: 0, sos: 0 };
      });
      CARDS_DB.forEach(c => {
        const st = appState.cards[c.id] || { status: "new", errCount: 0 };
        if (summary.byPack[c.pack]) {
          summary.byPack[c.pack].total++;
          if (st.status === "mastered") summary.byPack[c.pack].mastered++;
          if (st.status === "sos") summary.byPack[c.pack].sos++;
        }
        if (st.status === "mastered") summary.mastered.push(c.word);
        if (st.status === "review") summary.review.push(c.word);
        if (st.status === "sos") summary.sos.push(`${c.word} [${c.packName}]`);
        if (st.errCount > 0) summary.errCards[c.word] = st.errCount;
      });
      return {
        type: "gordon_state_sync",
        timestamp: new Date().toISOString(),
        currentPack,
        stats: appState.stats,
        summary,
        cards: appState.cards
      };
    }

    function forceSync(notify = false) {
      triggerCloudSync();
      if (notify) showToast("☁️ 已同步最新學習紀錄至雲端！");
    }

    // ============================================================================
    // 3. DROPDOWN PACK SELECTION & RESTART REVIEW LOGIC
    // ============================================================================
    function onPackSelectChange(packId) {
      currentPack = packId;
      currentCat = "all";
      currentIndex = 0;

      // Reset category pill highlight
      ["all", "phonics", "chunks", "roots", "grammar"].forEach(cat => {
        const el = document.getElementById(`cat-${cat}`);
        if (el) el.classList.toggle("active", cat === "all");
      });

      rebuildDeck();
      const pName = (PACK_META[packId] && PACK_META[packId].shortName) || packId;
      showToast(`📅 已切換至：${pName}`);
    }

    function selectCat(catId) {
      currentCat = catId;
      currentIndex = 0;
      ["all", "phonics", "chunks", "roots", "grammar"].forEach(cat => {
        const el = document.getElementById(`cat-${cat}`);
        if (el) el.classList.toggle("active", cat === catId);
      });
      rebuildDeck();
    }

    // Restart review for the current pack (and current category filter if selected)
    function restartCurrentScope(onlyCurrentCat = false) {
      let count = 0;
      CARDS_DB.forEach(c => {
        if (currentPack !== "all" && c.pack !== currentPack) return;
        if (onlyCurrentCat && currentCat !== "all" && c.cat !== currentCat) return;
        if (!appState.cards[c.id]) {
          appState.cards[c.id] = { status: "new", errCount: 0, passCount: 0, avgMs: 0, updatedAt: "" };
        } else {
          appState.cards[c.id].status = "new";
          appState.cards[c.id].updatedAt = new Date().toISOString();
        }
        count++;
      });

      currentMode = "todo";
      ["todo", "sos", "mastered", "report"].forEach(m => {
        document.getElementById(`m-${m}`).classList.toggle("active", m === "todo");
      });
      currentIndex = 0;
      saveState(true);
      rebuildDeck();
      const packShort = (PACK_META[currentPack] && PACK_META[currentPack].shortName) || "";
      showToast(`🔄 已重啟【${packShort}】共 ${count} 張閃卡，開始新一輪複習！`);
    }

    function confirmRestartPack() {
      const packShort = (PACK_META[currentPack] && PACK_META[currentPack].shortName) || "";
      if (confirm(`確定要將【${packShort}】已封印的單字重新放回「🔥 待消滅」再複習一輪嗎？`)) {
        restartCurrentScope(false);
      }
    }

    function updatePackAndModeCounts() {
      // 1. Update live counts inside the Dropdown <option> labels
      const packTotals = {};
      const packMastered = {};
      ["lichi_1108", "lichi_1101x", "lichi_1101", "lichi_1025", "lichi_1018", "midterm1", "all"].forEach(pk => {
        packTotals[pk] = 0;
        packMastered[pk] = 0;
      });

      CARDS_DB.forEach(c => {
        const st = (appState.cards[c.id] && appState.cards[c.id].status) || "new";
        packTotals[c.pack] = (packTotals[c.pack] || 0) + 1;
        packTotals["all"]++;
        if (st === "mastered") {
          packMastered[c.pack] = (packMastered[c.pack] || 0) + 1;
          packMastered["all"]++;
        }
      });

      Object.keys(PACK_META).forEach(pk => {
        const optEl = document.getElementById(`opt-${pk}`);
        if (optEl) {
          const m = packMastered[pk] || 0;
          const t = packTotals[pk] || 0;
          const doneTag = (m === t && t > 0) ? "✅ 已全數破關" : `${m}/${t} 已封印`;
          optEl.text = `${PACK_META[pk].name} (${doneTag})`;
        }
      });

      // 2. Update category pill counts for the currently selected pack
      const catCounts = { all: 0, phonics: 0, chunks: 0, roots: 0, grammar: 0 };
      CARDS_DB.forEach(c => {
        if (currentPack !== "all" && c.pack !== currentPack) return;
        catCounts.all++;
        if (catCounts[c.cat] !== undefined) catCounts[c.cat]++;
      });
      document.getElementById("cat-all").innerText = `🎯 本進度全部 (${catCounts.all})`;
      document.getElementById("cat-phonics").innerText = `🔤 單字與音節 (${catCounts.phonics})`;
      document.getElementById("cat-chunks").innerText = `🔗 必考片語 (${catCounts.chunks})`;
      document.getElementById("cat-roots").innerText = `⚠️ 熟詞生義/字根 (${catCounts.roots})`;
      const gramBtn = document.getElementById("cat-grammar");
      if (catCounts.grammar === 0) {
        gramBtn.style.display = "none";
      } else {
        gramBtn.style.display = "inline-block";
        gramBtn.innerText = `⚡ 文法秒殺 (${catCounts.grammar})`;
      }

      // 3. Update 4 mode tab counts for the currently selected pack + category
      let todo = 0, sos = 0, mastered = 0;
      CARDS_DB.forEach(c => {
        if (currentPack !== "all" && c.pack !== currentPack) return;
        if (currentCat !== "all" && c.cat !== currentCat) return;
        const st = (appState.cards[c.id] && appState.cards[c.id].status) || "new";
        if (st === "mastered") mastered++;
        else {
          todo++;
          if (st === "sos") sos++;
        }
      });

      document.getElementById("num-todo").innerText = todo;
      document.getElementById("num-sos").innerText = sos;
      document.getElementById("num-mastered").innerText = mastered;

      // Show mini restart button on top bar whenever at least 1 card in this pack is mastered
      const topRestartBtn = document.getElementById("top-restart-btn");
      if (topRestartBtn) {
        topRestartBtn.style.display = mastered > 0 ? "inline" : "none";
      }
    }

    function rebuildDeck() {
      updatePackAndModeCounts();

      filteredDeck = CARDS_DB.filter(c => {
        if (currentPack !== "all" && c.pack !== currentPack) return false;
        if (currentCat !== "all" && c.cat !== currentCat) return false;
        const st = (appState.cards[c.id] && appState.cards[c.id].status) || "new";
        if (currentMode === "todo") return st !== "mastered";
        if (currentMode === "sos") return st === "sos";
        if (currentMode === "mastered") return st === "mastered";
        return true;
      });

      if (currentIndex >= filteredDeck.length) currentIndex = 0;
      renderSingleCard();
    }

    // ============================================================================
    // 4. IN-PACK DISTRACTOR ENGINE & COMPLETION / RESTART SCREEN
    // ============================================================================
    function getThreeOptionsForCard(targetCard) {
      let samePackPool = CARDS_DB.filter(c => c.pack === targetCard.pack && c.id !== targetCard.id);
      if (samePackPool.length < 2) {
        samePackPool = CARDS_DB.filter(c => c.id !== targetCard.id);
      }
      const shuffledPool = samePackPool.sort(() => Math.random() - 0.5);
      const distractors = shuffledPool.slice(0, 2).map(x => ({ text: x.shortAns, isCorrect: false }));
      const opts = [{ text: targetCard.shortAns, isCorrect: true }, ...distractors];
      return opts.sort(() => Math.random() - 0.5);
    }

    function renderSingleCard() {
      const mount = document.getElementById("single-card-mount");
      const navBar = document.getElementById("nav-bar");
      const packShort = (PACK_META[currentPack] && PACK_META[currentPack].shortName) || "";
      const labelMap = {
        todo: `🎯 ${packShort} · 🔥 待消滅`,
        sos: `🎯 ${packShort} · 🛏️ 睡前急救室`,
        mastered: `🎯 ${packShort} · 😎 已封印複習`
      };
      document.getElementById("deck-label").innerText = labelMap[currentMode] || "";

      // Count total cards in this pack/cat scope
      const scopeCards = CARDS_DB.filter(c => {
        if (currentPack !== "all" && c.pack !== currentPack) return false;
        if (currentCat !== "all" && c.cat !== currentCat) return false;
        return true;
      });

      // WHEN DECK IS EMPTY -> SHOW COMPLETION & RESTART REVIEW SCREEN!
      if (filteredDeck.length === 0) {
        document.getElementById("deck-counter").innerText = "0 / 0 張";
        document.getElementById("deck-progress").style.width = "100%";
        navBar.style.display = "none";

        if (currentMode === "todo") {
          mount.innerHTML = `
            <div class="card-stage complete-stage">
              <div class="complete-icon">🎉</div>
              <div class="complete-title">太棒了！【${packShort}】此範圍已全數封印完成！</div>
              <div class="complete-desc">
                共 ${scopeCards.length} 張單字與片語皆已通過微測試考驗。<br>想要再重啟一輪複習加深印象，或切換其他進度嗎？
              </div>
              <div class="restart-btn-group">
                <button class="restart-primary-btn" onclick="restartCurrentScope(true)">
                  🔄 重啟本範圍複習（${scopeCards.length} 張重新洗牌再測一輪！）
                </button>
                <button class="restart-secondary-btn" onclick="switchMode('mastered')">
                  👀 不解除封印，直接去「😎 已封印」逐張抽考複習
                </button>
              </div>
            </div>
          `;
        } else if (currentMode === "sos") {
          mount.innerHTML = `
            <div class="card-stage complete-stage">
              <div class="complete-icon">✨</div>
              <div class="complete-title">目前【${packShort}】的「🛏️ 睡前急救室」是空的！</div>
              <div class="complete-desc">
                沒有卡住的死穴單字！你可以回到「🔥 待消滅」繼續闖關，或重啟整份進度再刷一輪。
              </div>
              <div class="restart-btn-group">
                <button class="restart-primary-btn" onclick="switchMode('todo')">
                  🔥 回到「待消滅清單」繼續闖關
                </button>
                <button class="restart-secondary-btn" onclick="restartCurrentScope(false)">
                  🔄 重啟【${packShort}】整份進度重新複習
                </button>
              </div>
            </div>
          `;
        } else {
          mount.innerHTML = `
            <div class="card-stage complete-stage">
              <div class="complete-icon">🌿</div>
              <div class="complete-title">目前【${packShort}】還沒有已封印的單字</div>
              <div class="complete-desc">
                快點選下方按鈕前往「🔥 待消滅」開始闖關吧！
              </div>
              <div class="restart-btn-group">
                <button class="restart-primary-btn" onclick="switchMode('todo')">
                  🔥 立即開始【${packShort}】闖關測驗
                </button>
              </div>
            </div>
          `;
        }
        return;
      }

      navBar.style.display = "flex";
      const card = filteredDeck[currentIndex];
      const stObj = appState.cards[card.id] || { status: "new", errCount: 0 };
      const total = filteredDeck.length;
      document.getElementById("deck-counter").innerText = `第 ${currentIndex + 1} / ${total} 張`;
      document.getElementById("deck-progress").style.width = `${Math.round(((currentIndex + 1) / total) * 100)}%`;

      const options = getThreeOptionsForCard(card);
      cardShownTime = Date.now();

      const stBadge =
        stObj.status === "sos" ? "🆘 睡前急救死穴" :
        stObj.status === "review" ? "🤔 明天再考" :
        stObj.status === "mastered" ? "😎 已封印" : "🆕 待闖關";

      mount.innerHTML = `
        <div class="card-stage">
          <div>
            <div class="card-meta-row">
              <span class="meta-tag">📌 ${card.packName} · ${card.catName}</span>
              <span class="status-tag">${stBadge} ${stObj.errCount > 0 ? `(曾錯 ${stObj.errCount} 次)` : ""}</span>
            </div>

            <div class="word-hero">
              <div class="word-main">${card.word}</div>
              <div class="word-syllable">🗣️ ${card.syllable}</div>
              <button class="audio-btn" onclick="speakText('${card.word.replace(/'/g, "\\'")}')">🔊 點此聽發音並跟讀</button>
            </div>
          </div>

          <!-- STEP 1: MICRO-TEST GATE -->
          <div id="gate-box">
            <div class="gate-title">👇 請點選正確意思（選對才可解鎖「😎 封印」）：</div>
            <div class="opt-list">
              ${options.map((o, idx) => `
                <button class="opt-btn" onclick="verifyGate(${o.isCorrect})">
                  (${String.fromCharCode(65 + idx)}) ${o.text}
                </button>
              `).join("")}
            </div>
            <button class="unsure-btn" onclick="verifyGate(false, true)">🤔 我還不熟，直接翻面看拆解與例句</button>
          </div>

          <!-- STEP 2: REVEALED EXPLANATION & CONSEQUENCES -->
          <div id="reveal-box" class="reveal-box">
            <div id="gate-result-banner" class="result-banner"></div>
            <div class="meaning-title">${card.meaning}</div>
            <div class="hack-card">🧠 <b>秒懂拆解：</b>${card.hack}</div>
            <div class="example-line">📝 <b>講義例句：</b>${card.example}</div>
            <div id="conseq-actions" class="action-group"></div>
          </div>
        </div>
      `;
    }

    function verifyGate(isCorrect, isUnsure = false) {
      const elapsedMs = Date.now() - cardShownTime;
      const card = filteredDeck[currentIndex];
      const stObj = appState.cards[card.id];

      if (!isUnsure && elapsedMs < 650 && !isCorrect) {
        appState.stats.fastClickWarnings = (appState.stats.fastClickWarnings || 0) + 1;
        showToast("⏳ 點太快囉！先看清楚音節與字根再選～");
      }

      appState.stats.totalAttempts = (appState.stats.totalAttempts || 0) + 1;
      stObj.avgMs = stObj.avgMs ? Math.round((stObj.avgMs + elapsedMs) / 2) : elapsedMs;

      document.getElementById("gate-box").style.display = "none";
      const revealBox = document.getElementById("reveal-box");
      const banner = document.getElementById("gate-result-banner");
      const actions = document.getElementById("conseq-actions");
      revealBox.style.display = "block";

      if (isCorrect) {
        appState.stats.firstTryCorrect = (appState.stats.firstTryCorrect || 0) + 1;
        stObj.passCount = (stObj.passCount || 0) + 1;
        saveState(true);

        banner.className = "result-banner pass";
        banner.innerText = "✅ 答對了！你已解鎖「😎 秒懂封印」權限！";

        actions.innerHTML = `
          <button class="conseq-btn btn-seal" onclick="applyDecision('${card.id}', 'mastered')">
            <div>
              <span class="c-main">😎 秒懂！封印這張卡</span>
              <span class="c-sub">➔ 結果：從本週待背清單消失（待背數 -1），跳下一張</span>
            </div>
            <span class="c-arrow">➔</span>
          </button>
          <button class="conseq-btn btn-keep" onclick="applyDecision('${card.id}', 'review')">
            <div>
              <span class="c-main">🤔 剛剛有點猶豫，留著再考我一次</span>
              <span class="c-sub">➔ 結果：留在本週待消滅清單，跳下一張</span>
            </div>
            <span class="c-arrow">➔</span>
          </button>
        `;
      } else {
        stObj.errCount = (stObj.errCount || 0) + 1;
        stObj.status = "sos";
        stObj.updatedAt = new Date().toISOString();
        saveState(true);

        banner.className = "result-banner fail";
        banner.innerText = isUnsure
          ? "💡 誠實面對不熟的字最棒！看懂下方拆解就記住囉（本次鎖定封印）"
          : "❌ 選錯囉！本次鎖定「封印」，系統已自動加入【🛏️ 睡前急救室】";

        actions.innerHTML = `
          <button class="conseq-btn btn-sos" onclick="applyDecision('${card.id}', 'sos')">
            <div>
              <span class="c-main">🛏️ 看懂拆解了！放進睡前急救室換下一張</span>
              <span class="c-sub">➔ 結果：收進本週「睡前急救(🆘)」，睡前 5 分鐘專攻它</span>
            </div>
            <span class="c-arrow">➔</span>
          </button>
        `;
      }
    }

    function applyDecision(cardId, newStatus) {
      const card = CARDS_DB.find(c => c.id === cardId);
      appState.cards[cardId].status = newStatus;
      appState.cards[cardId].updatedAt = new Date().toISOString();
      saveState(true);

      if (newStatus === "mastered") {
        showToast(`😎 已封印「${card.word}」！本週待消滅 -1`);
        rebuildDeck();
      } else {
        if (currentIndex < filteredDeck.length - 1) {
          currentIndex++;
        } else {
          currentIndex = 0;
        }
        rebuildDeck();
      }
    }

    function stepCard(delta) {
      if (filteredDeck.length === 0) return;
      currentIndex = (currentIndex + delta + filteredDeck.length) % filteredDeck.length;
      renderSingleCard();
    }

    function switchMode(mode) {
      currentMode = mode;
      ["todo", "sos", "mastered", "report"].forEach(m => {
        document.getElementById(`m-${m}`).classList.toggle("active", m === mode);
      });

      const isReport = (mode === "report");
      document.getElementById("deck-view").style.display = isReport ? "none" : "block";
      document.getElementById("filter-bar").style.display = isReport ? "none" : "flex";
      document.getElementById("report-view").style.display = isReport ? "block" : "none";

      if (isReport) {
        renderReportView();
      } else {
        currentIndex = 0;
        rebuildDeck();
      }
    }

    function speakText(text) {
      const clean = text
        .replace(/\(.*?\)/g, "")
        .replace(/vs\.|\.\.\.|\/|\+|＆|&|sb|sth/g, " ")
        .trim();
      if ("speechSynthesis" in window) {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(clean);
        u.lang = "en-US";
        u.rate = 0.88;
        window.speechSynthesis.speak(u);
      }
    }

    // ============================================================================
    // 5. PARENT / AI VERIFICATION REPORT (With Per-Week Breakdown & Restart Button)
    // ============================================================================
    function renderReportView() {
      const mastered = [], review = [], sos = [];
      const byPack = {
        lichi_1101x: { label: "🎯 11/01 考後：錯題＋圈字", total: 0, mastered: 0, sos: 0 },
        lichi_1101: { label: "🔥 11/01 考前：9000單 B篇", total: 0, mastered: 0, sos: 0 },
        lichi_1025: { label: "📅 上週：李奇 10/25 小考", total: 0, mastered: 0, sos: 0 },
        lichi_1018: { label: "📅 前週：李奇 10/18 小考", total: 0, mastered: 0, sos: 0 },
        midterm1:   { label: "🏫 段考：台中一中一段", total: 0, mastered: 0, sos: 0 }
      };

      CARDS_DB.forEach(c => {
        const st = (appState.cards[c.id] && appState.cards[c.id].status) || "new";
        if (byPack[c.pack]) {
          byPack[c.pack].total++;
          if (st === "mastered") byPack[c.pack].mastered++;
          if (st === "sos") byPack[c.pack].sos++;
        }
        if (currentPack === "all" || c.pack === currentPack) {
          if (st === "mastered") mastered.push(c.word);
          if (st === "review") review.push(c.word);
          if (st === "sos") sos.push(`${c.word} (${c.packName})`);
        }
      });

      document.getElementById("pack-breakdown-list").innerHTML = Object.keys(byPack).map(pk => {
        const info = byPack[pk];
        const pct = info.total > 0 ? Math.round((info.mastered / info.total) * 100) : 0;
        return `
          <div class="pack-breakdown-row">
            <span><b>${info.label}</b></span>
            <span>😎 <b>${info.mastered}/${info.total}</b> (${pct}%) · 🆘 ${info.sos}</span>
          </div>
        `;
      }).join("");

      const attempts = appState.stats.totalAttempts || 0;
      const correct = appState.stats.firstTryCorrect || 0;
      const acc = attempts > 0 ? Math.round((correct / attempts) * 100) : 0;
      const scopeTotal = currentPack === "all" ? CARDS_DB.length : CARDS_DB.filter(c => c.pack === currentPack).length;

      document.getElementById("report-metrics").innerHTML = `
        <div class="stat-item">
          <div class="stat-item-val" style="color: var(--green);">${mastered.length} / ${scopeTotal}</div>
          <div class="stat-item-lbl">😎 目前進度已封印</div>
        </div>
        <div class="stat-item">
          <div class="stat-item-val">${acc}% (${correct}/${attempts})</div>
          <div class="stat-item-lbl">🎯 微測試首次命中率</div>
        </div>
        <div class="stat-item">
          <div class="stat-item-val" style="color: var(--red);">${sos.length} 張</div>
          <div class="stat-item-lbl">🛏️ 目前進度急救卡</div>
        </div>
        <div class="stat-item">
          <div class="stat-item-val" style="color: var(--amber);">${appState.stats.fastClickWarnings || 0} 次</div>
          <div class="stat-item-lbl">⏳ 防秒按亂猜攔截</div>
        </div>
      `;

      document.getElementById("sos-word-list").innerHTML = `
        <div style="margin-bottom: 6px;"><b>🆘 目前範圍「睡前急救室」重點單字：</b><br>${sos.length ? sos.join("、") : "✨ 目前無死穴單字"}</div>
        <div style="color: var(--text-sub); font-size: 0.78rem;"><b>😎 目前範圍已驗證封印：</b>${mastered.length ? mastered.join(", ") : "尚無"}</div>
      `;
    }

    function copyReport() {
      const p = buildSyncPayload();
      const attempts = appState.stats.totalAttempts || 0;
      const correct = appState.stats.firstTryCorrect || 0;
      const acc = attempts > 0 ? Math.round((correct / attempts) * 100) : 0;
      const b1108 = p.summary.byPack.lichi_1108 || { mastered: 0, total: 0, sos: 0 };
      const b1108 = p.summary.byPack.lichi_1108 || { mastered: 0, total: 0, sos: 0 };
      const b1101 = p.summary.byPack.lichi_1101;
      const b1101x = p.summary.byPack.lichi_1101x;

      const text = [
        `【🌿 Gordon 英文閃卡分週進度戰報】`,
        `時間：${new Date().toLocaleString("zh-TW")}`,
        `🔥 本週 (11/08 考試進度)：已封印 ${b1108.mastered} / ${b1108.total} 張 (急救 ${b1108.sos} 張)`,
        `🔥 本週 (11/08 考試進度)：已封印 ${b1108.mastered} / ${b1108.total} 張 (急救 ${b1108.sos} 張)`,
        `🔥 本週 (11/01 9000單B篇) 進度：已封印 ${b1101.mastered} / ${b1101.total} 張 (急救 ${b1101.sos} 張)`,
        `🎯 11/01 考後錯題＋圈字：已封印 ${b1101x.mastered} / ${b1101x.total} 張 (急救 ${b1101x.sos} 張)`,
        `🎯 微測試首次命中率：${acc}% (${correct}/${attempts} 次)`,
        `😎 累計已封印 (${p.summary.mastered.length}字)：${p.summary.mastered.join(", ") || "無"}`,
        `🆘 睡前急救死穴 (${p.summary.sos.length}字)：${p.summary.sos.join("、") || "無"}`
      ].join("\n");

      navigator.clipboard.writeText(text).then(() => {
        showToast("📋 已複製分週學習戰報文字！");
      });
    }

    function downloadCSV() {
      const rows = [["卡片ID", "考試進度", "弱點分類", "英文單字與片語", "音節與發音", "中文意義", "目前狀態", "答錯次數", "平均思考毫秒", "最後更新時間"]];
      CARDS_DB.forEach(c => {
        const st = appState.cards[c.id] || { status: "new", errCount: 0, avgMs: 0, updatedAt: "" };
        rows.push([c.id, c.packName, c.catName, `"${c.word}"`, `"${c.syllable}"`, `"${c.meaning}"`, st.status, st.errCount || 0, st.avgMs || 0, st.updatedAt || ""]);
      });
      const csv = "\uFEFF" + rows.map(r => r.join(",")).join("\n");
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "Gordon_閃卡學習狀態總表.csv";
      a.click();
    }

    let toastTimer = null;
    function showToast(msg) {
      const t = document.getElementById("toast");
      t.innerText = msg;
      t.style.display = "block";
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { t.style.display = "none"; }, 2600);
    }

    window.onload = () => {
      loadState();
      rebuildDeck();
    };
  </script>
</body>
