<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Gordon閃卡" />
  <title>🌿 Gordon 專屬英文分週進度閃卡系統</title>
  <style>
    :root {
      --bg: #F5F4EF;
      --card: #FFFFFF;
      --text: #2C3539;
      --text-sub: #64748B;
      --primary: #2563EB;
      --primary-dark: #1E3A8A;
      --primary-light: #EFF6FF;
      --green: #2E7D5B;
      --green-light: #E8F5EE;
      --amber: #C27803;
      --amber-light: #FEF6E7;
      --red: #C84B31;
      --red-light: #FDF0ED;
      --border: #E2E0D8;
      --shadow: 0 8px 24px rgba(44, 53, 57, 0.06);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.55;
      padding: 12px 14px 36px;
      max-width: 520px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Minimal Top Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .app-title {
      font-size: 1.02rem;
      font-weight: 800;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .sync-pill {
      font-size: 0.74rem;
      padding: 4px 10px;
      border-radius: 99px;
      background: var(--green-light);
      color: var(--green);
      font-weight: 700;
      cursor: pointer;
    }

    /* =========================================================================
       CLEAN, COMFORTABLE SINGLE-BAR DROPDOWN SELECTOR
       ========================================================================= */
    .dropdown-card {
      background: var(--card);
      border: 1.5px solid #CBD5E1;
      border-radius: 14px;
      padding: 9px 12px;
      margin-bottom: 10px;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.03);
    }
    .dropdown-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 5px;
    }
    .dropdown-label {
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--text-sub);
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .isolated-tag {
      font-size: 0.68rem;
      background: var(--primary-light);
      color: var(--primary-dark);
      padding: 1px 7px;
      border-radius: 99px;
      font-weight: 700;
    }
    .select-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    .pack-select {
      width: 100%;
      appearance: none;
      -webkit-appearance: none;
      background: #F8FAFC;
      border: 1.5px solid #93C5FD;
      border-radius: 10px;
      padding: 9px 34px 9px 12px;
      font-size: 0.92rem;
      font-weight: 800;
      color: var(--primary-dark);
      cursor: pointer;
      outline: none;
      transition: border-color 0.15s, background 0.15s;
    }
    .pack-select:focus {
      border-color: var(--primary);
      background: #FFFFFF;
    }
    .select-arrow {
      position: absolute;
      right: 12px;
      pointer-events: none;
      font-size: 0.85rem;
      color: var(--primary-dark);
      font-weight: 900;
    }

    /* Mode Switcher Bar (4 Clean Tabs) */
    .mode-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      background: #EAE8E0;
      padding: 4px;
      border-radius: 12px;
      margin-bottom: 9px;
    }
    .mode-btn {
      border: none;
      background: transparent;
      color: var(--text-sub);
      padding: 7px 4px;
      border-radius: 9px;
      font-size: 0.76rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
    }
    .mode-btn.active {
      background: var(--card);
      color: var(--text);
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }
    .mode-count {
      font-size: 0.95rem;
      font-weight: 800;
    }

    /* Category Pill Filter Row */
    .cat-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      margin-bottom: 10px;
      scrollbar-width: none;
    }
    .cat-bar::-webkit-scrollbar { display: none; }
    .cat-pill {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text-sub);
      padding: 5px 11px;
      border-radius: 99px;
      font-size: 0.77rem;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
    }
    .cat-pill.active {
      background: var(--text);
      color: #FFFFFF;
      border-color: var(--text);
    }

    /* Progress Bar + Quick Restart Link */
    .progress-wrap {
      margin-bottom: 10px;
    }
    .progress-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.78rem;
      color: var(--text-sub);
      font-weight: 700;
      margin-bottom: 4px;
    }
    .mini-restart-btn {
      border: none;
      background: transparent;
      color: var(--primary);
      font-size: 0.75rem;
      font-weight: 800;
      cursor: pointer;
      text-decoration: underline;
      margin-left: 6px;
    }
    .progress-track {
      height: 7px;
      background: #E2E0D8;
      border-radius: 99px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--primary);
      border-radius: 99px;
      transition: width 0.3s ease;
    }

    /* ONE-CARD-AT-A-TIME FOCUS STAGE */
    .card-stage {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 20px 18px;
      box-shadow: var(--shadow);
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 400px;
    }

    .card-meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .meta-tag {
      font-size: 0.75rem;
      font-weight: 800;
      padding: 3px 10px;
      border-radius: 99px;
      background: var(--primary-light);
      color: var(--primary-dark);
    }
    .status-tag {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-sub);
    }

    /* Word Hero Display */
    .word-hero {
      text-align: center;
      padding: 14px 8px 18px;
      border-bottom: 1px solid #F0EFEA;
      margin-bottom: 14px;
    }
    .word-main {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--text);
      letter-spacing: 0.3px;
      line-height: 1.25;
      margin-bottom: 8px;
      word-break: break-word;
    }
    .word-syllable {
      font-size: 1rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 12px;
    }
    .audio-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--primary-light);
      color: var(--primary-dark);
      border: 1px solid #BFDBFE;
      padding: 7px 16px;
      border-radius: 99px;
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
    }
    .audio-btn:active { transform: scale(0.96); }

    /* STEP 1: Micro-Test Options (Anti-Blind-Click Gate) */
    .gate-title {
      font-size: 0.82rem;
      color: var(--text-sub);
      font-weight: 700;
      margin-bottom: 8px;
      text-align: center;
    }
    .opt-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .opt-btn {
      width: 100%;
      background: #FAF9F6;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 11px 14px;
      text-align: left;
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      transition: all 0.12s;
    }
    .opt-btn:hover { border-color: var(--primary); background: #FFFFFF; }
    .opt-btn:active { transform: scale(0.99); }

    .unsure-btn {
      margin-top: 8px;
      width: 100%;
      background: transparent;
      border: 1px dashed #CBD5E1;
      border-radius: 10px;
      padding: 8px;
      font-size: 0.8rem;
      color: var(--text-sub);
      font-weight: 600;
      cursor: pointer;
    }

    /* STEP 2: Revealed Back Explanation & Consequence Buttons */
    .reveal-box {
      display: none;
      animation: fadeIn 0.2s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .result-banner {
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 800;
      margin-bottom: 10px;
      text-align: center;
    }
    .result-banner.pass {
      background: var(--green-light);
      color: var(--green);
      border: 1px solid #B7E1CD;
    }
    .result-banner.fail {
      background: var(--amber-light);
      color: var(--amber);
      border: 1px solid #F6D8A6;
    }

    .meaning-title {
      font-size: 1.12rem;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 8px;
      text-align: center;
    }
    .hack-card {
      background: #F8FAFC;
      border-left: 4px solid var(--primary);
      padding: 9px 12px;
      border-radius: 0 10px 10px 0;
      font-size: 0.87rem;
      color: var(--text);
      margin-bottom: 9px;
    }
    .example-line {
      font-size: 0.82rem;
      color: var(--text-sub);
      background: #F5F4EF;
      padding: 8px 10px;
      border-radius: 8px;
      margin-bottom: 12px;
    }

    /* Consequence Action Buttons */
    .action-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .conseq-btn {
      width: 100%;
      border-radius: 12px;
      padding: 11px 14px;
      border: 1.5px solid transparent;
      cursor: pointer;
      text-align: left;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: transform 0.1s;
    }
    .conseq-btn:active { transform: scale(0.98); }
    .c-main { font-size: 0.9rem; font-weight: 800; display: block; }
    .c-sub { font-size: 0.74rem; opacity: 0.85; display: block; margin-top: 2px; }
    .c-arrow { font-size: 1.1rem; font-weight: 800; }

    .btn-seal {
      background: var(--green-light);
      border-color: #9CD6B8;
      color: #1B5E3F;
    }
    .btn-keep {
      background: var(--amber-light);
      border-color: #F3CC8A;
      color: #8C5400;
    }
    .btn-sos {
      background: var(--red-light);
      border-color: #F2B8AC;
      color: #962D17;
    }

    /* =========================================================================
       COMPLETION / RESTART REVIEW CARD UI
       ========================================================================= */
    .complete-stage {
      justify-content: center;
      align-items: center;
      text-align: center;
      min-height: 360px;
      padding: 24px 18px;
    }
    .complete-icon {
      font-size: 2.6rem;
      margin-bottom: 8px;
    }
    .complete-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 6px;
    }
    .complete-desc {
      font-size: 0.84rem;
      color: var(--text-sub);
      margin-bottom: 18px;
      max-width: 380px;
    }
    .restart-btn-group {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }
    .restart-primary-btn {
      width: 100%;
      padding: 13px 16px;
      border-radius: 12px;
      border: none;
      background: var(--primary);
      color: #FFFFFF;
      font-size: 0.94rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.22);
      transition: transform 0.1s;
    }
    .restart-primary-btn:active { transform: scale(0.98); }
    .restart-secondary-btn {
      width: 100%;
      padding: 11px 14px;
      border-radius: 12px;
      border: 1.5px solid var(--border);
      background: #FAF9F6;
      color: var(--text);
      font-size: 0.86rem;
      font-weight: 700;
      cursor: pointer;
    }
    .restart-secondary-btn:active { transform: scale(0.98); }

    /* Bottom Card Navigation (Prev / Next) */
    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .nav-btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text-sub);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
    }

    /* Report View */
    .report-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: var(--shadow);
    }
    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 10px 0 14px;
    }
    .stat-item {
      background: #F8F7F3;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }
    .stat-item-val { font-size: 1.15rem; font-weight: 800; color: var(--primary); }
    .stat-item-lbl { font-size: 0.75rem; color: var(--text-sub); }

    .pack-breakdown-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 7px 10px;
      background: #FAF9F6;
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 6px;
      font-size: 0.82rem;
    }

    .full-btn {
      width: 100%;
      padding: 11px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      margin-bottom: 8px;
      text-align: center;
    }
    .full-btn.primary {
      background: var(--primary);
      color: #FFFFFF;
      border-color: var(--primary);
    }

    #toast {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      background: #2C3539;
      color: #FFFFFF;
      padding: 10px 16px;
      border-radius: 99px;
      font-size: 0.82rem;
      font-weight: 700;
      box-shadow: 0 6px 20px rgba(0,0,0,0.2);
      display: none;
      z-index: 999;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="app-title">🌿 Gordon 分週進度閃卡</div>
    <div id="sync-status" class="sync-pill" onclick="forceSync(true)">☁️ 自動同步中</div>
  </div>

  <!-- =========================================================================
       CLEAN SINGLE-BAR DROPDOWN PROGRESS SELECTOR (Grouped & Scalable)
       ========================================================================= -->
  <div class="dropdown-card">
    <div class="dropdown-top-row">
      <span class="dropdown-label">📅 選擇考試進度（點下拉選單切換）</span>
      <span class="isolated-tag">各週獨立題庫 · 不混題</span>
    </div>
    <div class="select-wrapper">
      <select id="pack-select" class="pack-select" onchange="onPackSelectChange(this.value)">
        <optgroup label="📌 本週最新考試進度（預設）">
          <option value="lichi_1108" id="opt-lichi_1108" selected>🔥 李奇 11/08 小考｜9000單B+片語L7+火藥陰謀+龍騰L5 (0/46 已封印)</option>
        </optgroup>
        <optgroup label="🎯 考後錯題攻堅專區">
          <option value="lichi_1101x" id="opt-lichi_1101x">🎯 李奇 11/01 考後｜錯題＋圈字 (0/23 已封印)</option>
        </optgroup>
        <optgroup label="📅 歷屆李奇小考進度（由新到舊）">
          <option value="lichi_1025" id="opt-lichi_1025">📅 李奇 10/25 小考｜新聞長字與完成式 (0/16 已封印)</option>
          <option value="lichi_1018" id="opt-lichi_1018">📅 李奇 10/18 小考｜無被動與片語搭配 (0/12 已封印)</option>
        </optgroup>
        <optgroup label="🏫 學校段考專區">
          <option value="midterm1" id="opt-midterm1">🏫 台中一中 一段｜核心語塊與詞性 (0/12 已封印)</option>
        </optgroup>
        <optgroup label="📚 考前跨週大複習">
          <option value="all" id="opt-all">📚 跨週全部進度總複習 (0/68 已封印)</option>
        </optgroup>
      </select>
      <span class="select-arrow">▾</span>
    </div>
  </div>

  <!-- 4 Clean Mode Tabs (Counts apply strictly to the selected week!) -->
  <div class="mode-bar">
    <button class="mode-btn active" id="m-todo" onclick="switchMode('todo')">
      <span class="mode-count" id="num-todo">0</span>
      <span>🔥 待消滅</span>
    </button>
    <button class="mode-btn" id="m-sos" onclick="switchMode('sos')">
      <span class="mode-count" id="num-sos" style="color: var(--red);">0</span>
      <span>🛏️ 睡前急救</span>
    </button>
    <button class="mode-btn" id="m-mastered" onclick="switchMode('mastered')">
      <span class="mode-count" id="num-mastered" style="color: var(--green);">0</span>
      <span>😎 已封印</span>
    </button>
    <button class="mode-btn" id="m-report" onclick="switchMode('report')">
      <span class="mode-count">📊</span>
      <span>學習紀錄</span>
    </button>
  </div>

  <!-- One-Tap Category Pills within the Selected Week -->
  <div class="cat-bar" id="filter-bar">
    <button class="cat-pill active" id="cat-all" onclick="selectCat('all')">🎯 本進度全部</button>
    <button class="cat-pill" id="cat-phonics" onclick="selectCat('phonics')">🔤 單字與音節</button>
    <button class="cat-pill" id="cat-chunks" onclick="selectCat('chunks')">🔗 必考片語</button>
    <button class="cat-pill" id="cat-roots" onclick="selectCat('roots')">⚠️ 熟詞生義/字根</button>
    <button class="cat-pill" id="cat-grammar" onclick="selectCat('grammar')">⚡ 文法秒殺</button>
  </div>

  <!-- MAIN SINGLE-CARD STAGE -->
  <div id="deck-view">
    <div class="progress-wrap">
      <div class="progress-info">
        <span id="deck-label">目前範圍：李奇 11/01 · 🔥 待消滅</span>
        <span>
          <span id="deck-counter">第 1 / 1 張</span>
          <button class="mini-restart-btn" id="top-restart-btn" onclick="confirmRestartPack()" style="display: none;">🔄 重刷本進度</button>
        </span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="deck-progress" style="width: 0%;"></div>
      </div>
    </div>

    <div id="single-card-mount"></div>

    <div class="nav-bar" id="nav-bar">
      <button class="nav-btn" onclick="stepCard(-1)">⬅️ 上一張</button>
      <span style="font-size: 0.75rem; color: var(--text-sub); font-weight: 600;">選對意思才可解鎖「😎 封印」</span>
      <button class="nav-btn" onclick="stepCard(1)">下一張 ➡️</button>
    </div>
  </div>

  <!-- REPORT & AI SYNC VIEW -->
  <div id="report-view" style="display: none;">
    <div class="report-card">
      <h3 style="font-size: 1rem; margin-bottom: 4px;">📊 分週進度熟練度 ＆ 防亂點報告</h3>
      <p style="font-size: 0.78rem; color: var(--text-sub); margin-bottom: 10px;">
        系統獨立統計每一週考試進度的完成率、首次點擊正確率與睡前急救清單。
      </p>
      <div id="pack-breakdown-list" style="margin-bottom: 12px;"></div>
      <div class="stat-grid" id="report-metrics"></div>
      <div id="sos-word-list" style="font-size: 0.83rem; background: #FAF9F6; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); margin-bottom: 12px;"></div>

      <button class="full-btn primary" onclick="forceSync(true)">☁️ 立即同步最新紀錄至雲端</button>
      <button class="full-btn" onclick="copyReport()">📋 複製學習戰報文字 (傳給爸媽 / AI)</button>
      <button class="full-btn" onclick="downloadCSV()">📥 下載 Excel 試算表紀錄 (.csv)</button>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    // ============================================================================
    // 1. FLASHCARD DATABASE (Separated cleanly by Weekly Exam Pack)
    // ============================================================================

      { id: "c_1108_31", pack: "lichi_1108", packName: "李奇 11/08", cat: "chunks", catName: "🔗 必考片語", word: "be on a short fuse / have a short fuse", syllable: "short · fuse", shortAns: "性子急、容易被激怒、脾氣火爆", meaning: "phr. 脾氣火爆、動不動就發火（像引信很短容易引爆）", hack: "<b>fuse</b> 是炸彈引信；引信很短 (short fuse) 點火瞬間就爆 ➔ 形容人「脾氣火爆、動輒發飆」！", example: "Be careful around the boss today; he's on a very short fuse. (Honors p.29)" },
      { id: "c_1108_32", pack: "lichi_1108", packName: "李奇 11/08", cat: "chunks", catName: "🔗 必考片語", word: "ball court prepositions (球場介係詞)", syllable: "court · field · rink", shortAns: "on a court(籃/網球場) ｜ in a gym(體育館) ｜ at a sports center", meaning: "運動場所三大介係詞：on 表表面；in 表內部封閉空間；at 視為活動聚點", hack: "<b>on</b> a court / on a field / on a track；<b>in</b> a gym / in a pool；<b>at</b> a sports center / at a rink！", example: "I usually play with my classmates on the school basketball court after class. (Writing U1 p.11)" },
      { id: "c_1108_33", pack: "lichi_1108", packName: "李奇 11/08", cat: "grammar", catName: "⚡ 文法秒殺", word: "consist of 三合一組成公式", syllable: "con · sist · of", shortAns: "consist of (恆主動) = be composed of = be made up of", meaning: "由...組成：consist of (絕無被動式) ＝ be composed of ＝ be made up of", hack: "必考鐵律：看到 <b>be consisted of</b> 瞬間打叉！只能寫 <b>consists of</b> 或 <b>is composed of</b>！", example: "The committee consists of four men and three women. = is composed of... (Writing U1 p.12)" },
      { id: "c_1108_34", pack: "lichi_1108", packName: "李奇 11/08", cat: "grammar", catName: "⚡ 文法秒殺", word: "感官動詞改被動必補 to", syllable: "be · seen · to · VR", shortAns: "主動看見省略 to ➔ 被動式必須把 to 補回來！", meaning: "感官動詞(see/hear/watch/notice)改被動時，原形動詞前一定要補上 to！", hack: "主動：I saw him enter the house. ➔ 改被動必寫：<b>He was seen TO enter the house.</b>（to 絕不可漏）！", example: "An airplane was seen to fly overhead. / He was seen to enter the bank. (Grammar Ch2 p.49)" },
      { id: "c_1108_35", pack: "lichi_1108", packName: "李奇 11/08", cat: "grammar", catName: "⚡ 文法秒殺", word: "不及物動詞＋介系詞之被動", syllable: "be · dealt · with", shortAns: "被動時介系詞絕不可丟掉（如 be dealt with）", meaning: "動詞片語改被動時，後方介系詞必須緊黏在 p.p. 後面", hack: "主動：We must deal with the problem. ➔ 被動：<b>The problem must be dealt WITH immediately.</b>（with 不可漏）！", example: "The problem must be dealt with by the authorities without delay. (Grammar Ch2 p.46)" },
      { id: "c_1108_36", pack: "lichi_1108", packName: "李奇 11/08", cat: "roots", catName: "⚠️ 熟詞生義", word: "plastic / plastic surgery", syllable: "plas · tic ['plæstɪk]", shortAns: "adj. 塑膠製的；易塑形的 ＆ n. 整形手術", meaning: "plastic adj. 塑膠的；可塑的；plastic surgery 整形手術；plastic n. 塑膠", hack: "<b>plastic</b> 原義為「可塑形的」➔ <b>plastic surgery</b> 指整形手術（重塑外貌）！", example: "Many cosmetic clinics offer plastic surgery to alter facial features. (L5 p.107)" },
      { id: "c_1108_37", pack: "lichi_1108", packName: "李奇 11/08", cat: "chunks", catName: "🔗 必考片語", word: "at one's convenience", syllable: "con · ven · ience", shortAns: "在某人方便的時候（常用於商務/禮貌書信）", meaning: "phr. 在您方便的時候 (= when it is convenient for you)", hack: "書信必背：<b>Please reply at your earliest convenience.</b>（請儘速在您方便時回覆）。", example: "Feel free to call me back at your convenience. (L5 p.107)" },
      { id: "c_1108_38", pack: "lichi_1108", packName: "李奇 11/08", cat: "chunks", catName: "🔗 必考片語", word: "eager / be eager for (sth / to V)", syllable: "ea · ger ['iɡɚ]", shortAns: "adj. 熱切的、渴望的（be eager to V / for N）", meaning: "adj. 熱切渴望的；副詞 eagerly 渴望地；名詞 eagerness 渴望", hack: "課本片語：<b>be eager for sth</b>（渴望某物）；<b>be eager to V</b>（渴望去做...）。", example: "Rick is eagerly waiting for his boss to approve his vacation request. (L5 p.107)" },
      { id: "c_1108_39", pack: "lichi_1108", packName: "李奇 11/08", cat: "phonics", catName: "🔤 單字與音節", word: "surroundings (恆用複數)", syllable: "sur · round · ings", shortAns: "n. pl. 周圍環境、周圍事物（字尾必加 s）", meaning: "n. (恆用複數) 周圍環境、周遭事物", hack: "<b>surround</b> 是動詞「環繞」；加上 -ings 變成<b>恆用複數名詞</b> <b>surroundings</b> 指生活環境！", example: "Animals blend into their natural surroundings to avoid being spotted by predators. (L5 p.108)" },
      { id: "c_1108_40", pack: "lichi_1108", packName: "李奇 11/08", cat: "roots", catName: "⚠️ 熟詞生義", word: "consume / consumer / consumption", syllable: "con · sume [kən'sum]", shortAns: "v. 吃喝；消耗、耗費 ＆ n. 消費者 ＆ n. 消耗量", meaning: "consume v. 消耗(能源/時間)；吃喝；consumer n. 消費者；consumption n. 消耗量", hack: "<b>consume time / energy</b>（消耗時間精力）；開車前不要 <b>consume alcohol</b>（飲酒）！", example: "Finishing his weekly assignments consumes most of his weekend time. (L5 p.110)" },
      { id: "c_1108_41", pack: "lichi_1108", packName: "李奇 11/08", cat: "chunks", catName: "🔗 必考片語", word: "come along (龍騰 L5 片語 1)", syllable: "come · a · long", shortAns: "到達、出現；隨同、跟著一起來", meaning: "phr. 出現、到來 (= arrive / appear)；隨同前往", hack: "課本真題：機會或幫手「出現」用 <b>come along</b>；<b>Wait until a better opportunity comes along.</b>", example: "Luckily, when we moved, some friends came along and helped us clean up. (L5 p.113)" },
      { id: "c_1108_42", pack: "lichi_1108", packName: "李奇 11/08", cat: "chunks", catName: "🔗 必考片語", word: "pack...up (龍騰 L5 片語 2)", syllable: "pack · up", shortAns: "收拾、打包（行李或隨身物品）", meaning: "phr. 收拾、打包(行李)；代名詞放中間 pack it up", hack: "離職或搬家打包：<b>pack up all his things</b>；可分雙字動詞，代名詞必放中間 <b>pack them up</b>！", example: "After he got fired, he sadly packed up all his belongings and left. (L5 p.114)" },
      { id: "c_1108_43", pack: "lichi_1108", packName: "李奇 11/08", cat: "chunks", catName: "🔗 必考片語", word: "on one's own (龍騰 L5 片語 3)", syllable: "on · one's · own", shortAns: "獨自一人、靠自己 (= by oneself / alone)", meaning: "phr. 獨自、靠自己、無人協助 (= independently / by oneself)", hack: "同義抽換必考：<b>on his own = by himself</b>；介系詞用 <b>on</b>！", example: "Tim finished all the work on his own because his colleagues were stuck in traffic. (L5 p.114)" },
      { id: "c_1108_44", pack: "lichi_1108", packName: "李奇 11/08", cat: "chunks", catName: "🔗 必考片語", word: "for a while (龍騰 L5 片語 4)", syllable: "for · a · while", shortAns: "一陣子、一段時間（修飾時間長度）", meaning: "phr. 一陣子、一段時間；for quite a while 相當長的一段時間", hack: "<b>for a while</b> 是時間副詞片語；若換成連詞是 <b>while S + V</b>。", example: "After a hard day's work, she could finally sit down and rest for a while. (L5 p.114)" },
      { id: "c_1108_45", pack: "lichi_1108", packName: "李奇 11/08", cat: "chunks", catName: "🔗 必考片語", word: "end up (+ V-ing / prep / adj) (龍騰 L5 片語 5)", syllable: "end · up", shortAns: "最後結果是...、落得...下場", meaning: "phr. 最後落得...下場、最終結果是（常接 V-ing 或介系詞片語）", hack: "大考超高頻：<b>end up paying a fine</b>（最後落得付罰款）；<b>end up in prison</b>（最後鋃鐺入獄）！", example: "The mayor ended up in prison for accepting bribes. (L5 p.114)" },
      { id: "c_1108_46", pack: "lichi_1108", packName: "李奇 11/08", cat: "grammar", catName: "⚡ 文法秒殺", word: "使役動詞主動 vs. 被動 (make/have/let)", syllable: "make · have · let", shortAns: "主動叫某人做接 VR ｜ 被動事物被做接 p.p.", meaning: "S + make/have/let + O + VR (主動) ｜ S + have/get + O + p.p. (被動受詞被處理)", hack: "課本句型：The police officer <b>made him show</b> his license.（叫他拿駕照 ➔ 接原形 VR）！", example: "Our teacher had us memorize twenty new words every day. (L5 p.115)" },
      // ==========================================================================
      // 🔥 本週最新進度：李奇 11/08 小考 (9000單B篇p.31-35+片語L7+火藥陰謀+龍騰L5, 共 46 張)
      // ==========================================================================
      { id: "c_1108_01", pack: "lichi_1108", packName: "李奇 11/08", cat: "roots", catName: "⚠️ 熟詞生義", word: "beam (一詞多義)", syllable: "beam [bim]", shortAns: "n. 光束；屋頂主樑；喜色 ／ v. 眉開眼笑", meaning: "n. 光束、光線；(建築)主樑；笑容喜色；v. 眉開眼笑、喜形於色", hack: "106學測考光線 <b>beam of light</b>；108學測考屋頂主樑 <b>main beam of the roof</b>；1101小考Q1考動詞 <b>beam with joy</b>（因喜悅而眉開眼笑）！", example: "A beam of light fell on the floor. (106學測) / She beamed at her friend with excitement. (p.31)" },
      { id: "c_1108_02", pack: "lichi_1108", packName: "李奇 11/08", cat: "chunks", catName: "🔗 必考片語", word: "beard the lion in its den", syllable: "beard · the · li · on", shortAns: "太歲頭上動土、直闖賊窟挑戰強權", meaning: "phr. 太歲頭上動土；正面挑戰有權勢或居高位者", hack: "<b>beard</b> 當動詞是「抓鬍鬚」➔ 跑到獅子的巢穴 (den) 拔獅子鬍子 ➔ 太歲頭上動土、直搗黃龍！", example: "The lawyer had to beard the lion in its den, taking on powerful corporations. (p.32)" },
      { id: "c_1108_03", pack: "lichi_1108", packName: "李奇 11/08", cat: "chunks", catName: "🔗 必考片語", word: "beat around the bush", syllable: "beat · a · round · the · bush", shortAns: "說話拐彎抹角、繞圈子不切正題", meaning: "phr. 拐彎抹角、旁敲側擊、不直說重點", hack: "獵人不直接打灌木叢 (bush) 抓兔子，而是在周圍敲打 ➔ 說話「拐彎抹角」！反義詞：get straight to the point。", example: "Stop beating around the bush and tell me what really happened. (p.32)" },
      { id: "c_1108_04", pack: "lichi_1108", packName: "李奇 11/08", cat: "chunks", catName: "🔗 必考片語", word: "beat a hasty retreat", syllable: "beat · a · has · ty · re · treat", shortAns: "倉皇撤退、狼狽逃竄", meaning: "phr. 倉皇撤退、匆忙離開（以避免尷尬或危險）", hack: "<b>beat a retreat</b> 原指軍隊打鼓信號撤兵；加上 <b>hasty</b>（匆忙的）➔ 倉皇撤退、拔腿就跑！", example: "Seeing they were outnumbered, the soldiers beat a hasty retreat. (p.32)" },
      { id: "c_1108_05", pack: "lichi_1108", packName: "李奇 11/08", cat: "chunks", catName: "🔗 必考片語", word: "beg to differ", syllable: "beg · to · dif · fer", shortAns: "恕不敢苟同、持有不同看法（禮貌說法）", meaning: "phr. 恕不敢苟同、我有不同意見", hack: "<b>beg to differ</b> 是英文辯論中最優雅有禮的異議：「請容我持有不同意見」！", example: "I beg to differ with you on this topic; I believe the opposite. (p.33)" },
      { id: "c_1108_06", pack: "lichi_1108", packName: "李奇 11/08", cat: "chunks", catName: "🔗 必考片語", word: "Beggars can't be choosers", syllable: "beg · gars · choos · ers", shortAns: "要飯的哪能挑肥揀瘦（沒有選擇餘地）", meaning: "【諺語】乞丐不能挑揀；在別無選擇時只能接受眼前事物", hack: "<b>beggar</b>（乞丐），大考常考諺語：別無選擇時只能將就！", example: "The hotel room wasn't great, but beggars can't be choosers during peak season. (p.33)" },
      { id: "c_1108_07", pack: "lichi_1108", packName: "李奇 11/08", cat: "chunks", catName: "🔗 必考片語", word: "behave oneself", syllable: "be · have · one · self", shortAns: "守規矩、舉止得體、檢點言行", meaning: "phr. 舉止合宜、守規矩（主詞受詞為同一人必加反身代名詞）", hack: "不能只講 behave，要講 <b>behave yourself / ourselves</b>（注意禮貌、守規矩）！", example: "It's important to behave ourselves in social situations to avoid making others uncomfortable. (p.34)" },
      { id: "c_1108_08", pack: "lichi_1108", packName: "李奇 11/08", cat: "chunks", catName: "🔗 必考片語", word: "come into being", syllable: "come · in · to · be · ing", shortAns: "誕生、形成、開始存在", meaning: "phr. 形成、誕生、開始存在 (= come into existence)", hack: "<b>being</b> 在此是「存在 (n.)」；進入存在狀態 ➔ 誕生、問世！", example: "The precise moment when the universe came into being remains unknown. (p.34)" },
      { id: "c_1108_09", pack: "lichi_1108", packName: "李奇 11/08", cat: "chunks", catName: "🔗 必考片語", word: "bend to sth", syllable: "bend · to", shortAns: "屈服於、順從（壓力或期望）", meaning: "phr. 屈服於...、迎合... (= yield to / bow to)", hack: "<b>bend</b> 是彎腰；朝向某人彎下身子 ➔ <b>bend to pressure / others' expectations</b>（向壓力屈服）！", example: "It's important not to bend to others' expectations if they don't align with our values. (p.35)" },
      { id: "c_1108_10", pack: "lichi_1108", packName: "李奇 11/08", cat: "roots", catName: "⚠️ 熟詞生義", word: "beneath / be beneath sb", syllable: "be · neath [bɪ'niθ]", shortAns: "prep. 在...之下 ／ be beneath sb 不屑做、有失身分", meaning: "prep. 在...下方；【熟詞生義】對某人來說有失身分、不屑一顧", hack: "高級用法：<b>He thought washing dishes was beneath him.</b>（他認為洗碗有失他的身分／不屑做）。", example: "As a leader, he felt that such trivial gossip was beneath him and refused to engage. (p.35)" },
      { id: "c_1108_11", pack: "lichi_1108", packName: "李奇 11/08", cat: "chunks", catName: "🔗 必考片語", word: "benefit from / be of benefit to", syllable: "ben · e · fit ['bɛnəfɪt]", shortAns: "從...受益（動詞）＆ 對...有益（形容詞義）", meaning: "benefit from 從...中獲得好處；be of benefit to 對...有利益", hack: "<b>benefit from + N</b>（受惠於...）；名詞結構 <b>be of + 抽象名詞 = adj.</b> ➔ be of benefit to = be beneficial to！", example: "Students can benefit from reading diverse materials to expand their knowledge. (p.35)" },
      { id: "c_1108_12", pack: "lichi_1108", packName: "李奇 11/08", cat: "chunks", catName: "🔗 必考片語", word: "point out (指名/指出)", syllable: "point · out", shortAns: "指出、指明；提醒某人注意", meaning: "phr. 指出、指明 (= indicate / show)；代名詞放中間 point it out", hack: "可分雙字動詞：代名詞必放中間 <b>point it out</b>；指給某人看介系詞搭 to <b>point sth out to sb</b>！", example: "The teacher pointed out the grammatical mistakes in my composition. (L7 p.92)" },
      { id: "c_1108_13", pack: "lichi_1108", packName: "李奇 11/08", cat: "chunks", catName: "🔗 必考片語", word: "be over vs. be through with", syllable: "be · o · ver", shortAns: "結束、完畢（主詞為事情）；人結束用 be through with", meaning: "be over 結束(主詞為事物/會議)；be through with 完成/與...斷絕(主詞為人)", hack: "<b>會議/電影結束</b>：The meeting is over；<b>某人做完報告/斷絕關係</b>：I am through with this report！", example: "After the concert was over, we went to a café. / When will you be through with your report? (L7 p.93)" },
      { id: "c_1108_14", pack: "lichi_1108", packName: "李奇 11/08", cat: "chunks", catName: "🔗 必考片語", word: "be up (專指時間到了)", syllable: "be · up", shortAns: "（時間）到了、終了（專指時間結束）", meaning: "phr. 時間到了、終了（主詞專門用 time）", hack: "考試老師收卷必說：<b>Time is up! Hand in your papers.</b>（時間到了！交卷）。", example: "The referee blew the whistle when time was up. (L7 p.94)" },
      { id: "c_1108_15", pack: "lichi_1108", packName: "李奇 11/08", cat: "chunks", catName: "🔗 必考片語", word: "on time vs. in time", syllable: "on · time ／ in · time", shortAns: "準時（按時刻表）vs. 及時（趕上最後期限/終究）", meaning: "on time 準時(一分不差)；in time 及時(在時限前趕上)；in time 亦可表「終究」", hack: "<b>on time</b> = punctual（火車準時進站）；<b>in time (for sth / to V)</b> = 趕上（及時趕上末班車）！", example: "The train arrived on time. / We got to the station just in time to catch the last train. (L7 p.95)" },
      { id: "c_1108_16", pack: "lichi_1108", packName: "李奇 11/08", cat: "chunks", catName: "🔗 必考片語", word: "get better / worse", syllable: "get · bet · ter", shortAns: "病情或情況好轉 ／ 惡化", meaning: "phr. 情況好轉、康復 (= improve) ／ 惡化 (= deteriorate)", hack: "<b>get</b> 在此為連綴動詞表「逐漸變成」；搭配：<b>is getting better day by day</b>（一天天好轉）。", example: "John has been ill for weeks, but now he is gradually getting better. (L7 p.96)" },
      { id: "c_1108_17", pack: "lichi_1108", packName: "李奇 11/08", cat: "grammar", catName: "⚡ 文法秒殺", word: "had better + VR (否定: had better not)", syllable: "had · bet · ter", shortAns: "最好去做...（後接原形動詞；否定 not 放後面）", meaning: "助動詞片語：最好去做...（口氣強烈）；否定寫 had better not + VR", hack: "必考陷阱：1. 後面一律接<b>原形動詞</b>；2. 否定直接加 not：<b>You had better not go alone</b>（絕不能加 don't）！", example: "You had better consult a doctor before taking the medicine, hadn't you? (L7 p.97)" },
      { id: "c_1108_18", pack: "lichi_1108", packName: "李奇 11/08", cat: "chunks", catName: "🔗 必考片語", word: "get sick / tired / nervous", syllable: "get · sick", shortAns: "生病、感到疲倦、緊張（get + adj. 表轉變）", meaning: "phr. 變成生病／疲倦／緊張的狀態", hack: "<b>get</b> 後接形容詞表示「狀態的轉變」：get sick（生病）、get exhausted（筋疲力盡）、get nervous（緊張）。", example: "Every day at about four o'clock I get very hungry. (L7 p.98)" },
      { id: "c_1108_19", pack: "lichi_1108", packName: "李奇 11/08", cat: "grammar", catName: "⚡ 文法秒殺", word: "would rather V1 than V2", syllable: "would · rath · er", shortAns: "寧願做 V1 也不願做 V2（兩邊皆接原形動詞）", meaning: "phr. 寧願做 A 也不願做 B（V1、V2 均為原形動詞）；否定 would rather not + VR", hack: "對比公式：<b>would rather + VR ... than + VR</b>；若換成 prefer：<b>prefer V-ing to V-ing</b> 或 <b>prefer to V1 rather than V2</b>！", example: "I would rather go for a walk than see a movie tonight. (L7 p.98)" },
      { id: "c_1108_20", pack: "lichi_1108", packName: "李奇 11/08", cat: "chunks", catName: "🔗 必考片語", word: "by the way vs. in the way", syllable: "by · the · way", shortAns: "順便一提（轉移話題）vs. 擋路、妨礙", meaning: "by the way 順便一提(= incidentally)；in the way 擋路、妨礙；on the way 在途中", hack: "<b>by the way</b> 插入口語開頭轉話題；<b>Don't stand in the way!</b>（別擋路妨礙我）！", example: "By the way, have you seen the new movie playing at Radio City? (L7 p.99)" },
      { id: "c_1108_21", pack: "lichi_1108", packName: "李奇 11/08", cat: "chunks", catName: "🔗 必考片語", word: "figure out", syllable: "fig · ure · out", shortAns: "想出、算出、理解、弄明白", meaning: "phr. 想出、算出、理解、明白 (= calculate / understand / solve)", hack: "<b>figure out the cost</b>（算出費用）；<b>I just can't figure him out</b>（我實在搞不懂他，代名詞放中間）！", example: "This letter is so poorly written that I can't figure out what the writer is trying to say. (L7 p.100)" },
      { id: "c_1108_22", pack: "lichi_1108", packName: "李奇 11/08", cat: "chunks", catName: "🔗 必考片語", word: "put off (延期) vs. call off (取消)", syllable: "put · off", shortAns: "延期、推遲 (= postpone) ；注意 call off 是取消", meaning: "put off 延期、延緩 (= postpone)；名言：今日事今日畢 Never put off until tomorrow...", hack: "克漏字高頻互換：<b>put off = postpone</b>；千萬不要和 <b>call off = cancel</b>（取消）混淆！", example: "Never put off until tomorrow what you can do today. (今日事今日畢, L7 p.100)" },
      { id: "c_1108_23", pack: "lichi_1108", packName: "李奇 11/08", cat: "phonics", catName: "🔤 單字與音節", word: "treason & plot", syllable: "trea · son ['trizn] ／ plot [plɑt]", shortAns: "n. 叛國罪、背叛 ＆ n. 密謀、陰謀", meaning: "treason n. 叛國罪、通敵罪；plot n. 密謀、陰謀、情節", hack: "英國歷史名句：<b>Gunpowder, treason and plot!</b>（火藥、叛國與陰謀）。<b>plot against sb</b>（密謀對付某人）。", example: "Back in 1605, Catholics were caught practicing their faith and charged with treason. (Honors p.29)" },
      { id: "c_1108_24", pack: "lichi_1108", packName: "李奇 11/08", cat: "roots", catName: "⚠️ 熟詞生義", word: "persecution vs. prosecution", syllable: "per · se · cu · tion", shortAns: "迫害、虐待（宗教/種族）vs. 檢察官起訴", meaning: "persecution n. 迫害、殘害；prosecution n. (法律上的)起訴、檢控", hack: "<b>persecute</b>（per-徹底 + secute跟隨 ➔ 緊咬不放 ➔ 迫害）；<b>prosecute</b>（pro-向前 ➔ 往前推進司法 ➔ 起訴）！", example: "Catholics faced severe religious persecution in England at the time. (Honors p.29)" },
      { id: "c_1108_25", pack: "lichi_1108", packName: "李奇 11/08", cat: "phonics", catName: "🔤 單字與音節", word: "execute & execution", syllable: "ex · e · cute ['ɛksɪˌkjut]", shortAns: "v. 處決；執行（計畫） ＆ n. 處決、執行", meaning: "execute v. 處決、處死；執行、實施；execution n. 處決、執行", hack: "雙重考點：1. <b>be executed for treason</b>（因叛國被處死）；2. <b>execute a plan</b>（執行計畫）。", example: "Guy Fawkes was imprisoned in the Tower of London and later executed. (Honors p.30)" },
      { id: "c_1108_26", pack: "lichi_1108", packName: "李奇 11/08", cat: "roots", catName: "⚠️ 熟詞生義", word: "lenient vs. strict", syllable: "le · ni · ent ['liniənt]", shortAns: "adj. 寬容的、寬大的（判決或處罰）", meaning: "adj. 寬大的、寬容的、仁慈的；反義詞：strict (嚴厲的)", hack: "法庭與政壇高頻字：<b>a lenient sentence</b>（輕判、寬大處分）。", example: "People hoped the new king might be more lenient toward religious minorities. (Honors p.29)" },
      { id: "c_1108_27", pack: "lichi_1108", packName: "李奇 11/08", cat: "roots", catName: "🧩 字根拆解", word: "conspirator & conspire", syllable: "con · spir · a · tor", shortAns: "n. 陰謀策劃者、共謀者 ／ v. 密謀", meaning: "conspirator n. 共謀者、同謀；conspire v. 密謀、圖謀", hack: "<b>con-</b>（共同）+ <b>spire</b>（呼吸）➔ 聚在一起同呼吸低聲密謀 ➔ <b>conspirators</b>（密謀者群）！", example: "A group of conspirators decided to blow up the Houses of Parliament. (Honors p.29)" },
      { id: "c_1108_28", pack: "lichi_1108", packName: "李奇 11/08", cat: "roots", catName: "🧩 字根拆解", word: "audacious & audacity", syllable: "au · da · cious [ɔ'deʃəs]", shortAns: "adj. 大膽的、敢作敢為的、放肆的", meaning: "audacious adj. 大膽的、冒失放肆的；audacity n. 勇氣、厚顏無恥", hack: "<b>aud-</b>（敢）➔ 敢在國會地下室放 36 桶炸藥就是 <b>an audacious plot</b>（大膽放肆的陰謀）！", example: "Planning to assassinate the king during the opening of Parliament was an audacious plot. (Honors p.29)" },
      { id: "c_1108_29", pack: "lichi_1108", packName: "李奇 11/08", cat: "roots", catName: "⚠️ 熟詞生義", word: "foil (a plot / crime)", syllable: "foil [fɔɪl]", shortAns: "v. 挫敗、阻止（陰謀、犯罪或計畫）", meaning: "v. 挫敗、制止(犯罪、陰謀)；n. 錫箔紙(aluminum foil)", hack: "熟詞生義：除了錫箔紙，當動詞專門搭配 <b>foil a plot / foil a robbery</b>（挫敗陰謀／阻止搶案）！", example: "The police managed to foil the terrorist plot just hours before the attack. (Honors p.30)" },
      { id: "c_1108_30", pack: "lichi_1108", packName: "李奇 11/08", cat: "chunks", catName: "🔗 必考片語", word: "repeal (a law / act)", syllable: "re · peal [rɪ'pil]", shortAns: "v. 廢除、撤銷（法令、條約）", meaning: "v. 廢除、撤銷(法律) (= abolish / revoke)", hack: "法律英文核心字：<b>repeal an act / law</b>（廢除法案）。", example: "The law was repealed in 1859, but Bonfire Night is still celebrated today. (Honors p.30)" },
      { id: "c_1108_31", pack: "lichi_1108", packName: "李奇 11/08", cat: "chunks", catName: "🔗 必考片語", word: "be on a short fuse / have a short fuse", syllable: "short · fuse", shortAns: "性子急、容易被激怒、脾氣火爆", meaning: "phr. 脾氣火爆、動不動就發火（像引信很短容易引爆）", hack: "<b>fuse</b> 是炸彈引信；引信很短 (short fuse) 點火瞬間就爆 ➔ 形容人「脾氣火爆、動輒發飆」！", example: "Be careful around the boss today; he's on a very short fuse. (Honors p.29)" },
      { id: "c_1108_32", pack: "lichi_1108", packName: "李奇 11/08", cat: "chunks", catName: "🔗 必考片語", word: "ball court prepositions (球場介係詞)", syllable: "court · field · rink", shortAns: "on a court(籃/網球場) ｜ in a gym(體育館) ｜ at a sports center", meaning: "運動場所三大介係詞：on 表表面；in 表內部封閉空間；at 視為活動聚點", hack: "<b>on</b> a court / on a field / on a track；<b>in</b> a gym / in a pool；<b>at</b> a sports center / at a rink！", example: "I usually play with my classmates on the school basketball court after class. (Writing U1 p.11)" },
      { id: "c_1108_33", pack: "lichi_1108", packName: "李奇 11/08", cat: "grammar", catName: "⚡ 文法秒殺", word: "consist of 三合一組成公式", syllable: "con · sist · of", shortAns: "consist of (恆主動) = be composed of = be made up of", meaning: "由...組成：consist of (絕無被動式) ＝ be composed of ＝ be made up of", hack: "必考鐵律：看到 <b>be consisted of</b> 瞬間打叉！只能寫 <b>consists of</b> 或 <b>is composed of</b>！", example: "The committee consists of four men and three women. = is composed of... (Writing U1 p.12)" },
      { id: "c_1108_34", pack: "lichi_1108", packName: "李奇 11/08", cat: "grammar", catName: "⚡ 文法秒殺", word: "感官動詞改被動必補 to", syllable: "be · seen · to · VR", shortAns: "主動看見省略 to ➔ 被動式必須把 to 補回來！", meaning: "感官動詞(see/hear/watch/notice)改被動時，原形動詞前一定要補上 to！", hack: "主動：I saw him enter the house. ➔ 改被動必寫：<b>He was seen TO enter the house.</b>（to 絕不可漏）！", example: "An airplane was seen to fly overhead. / He was seen to enter the bank. (Grammar Ch2 p.49)" },
      { id: "c_1108_35", pack: "lichi_1108", packName: "李奇 11/08", cat: "grammar", catName: "⚡ 文法秒殺", word: "不及物動詞＋介系詞之被動", syllable: "be · dealt · with", shortAns: "被動時介系詞絕不可丟掉（如 be dealt with）", meaning: "動詞片語改被動時，後方介系詞必須緊黏在 p.p. 後面", hack: "主動：We must deal with the problem. ➔ 被動：<b>The problem must be dealt WITH immediately.</b>（with 不可漏）！", example: "The problem must be dealt with by the authorities without delay. (Grammar Ch2 p.46)" },
      { id: "c_1108_36", pack: "lichi_1108", packName: "李奇 11/08", cat: "roots", catName: "⚠️ 熟詞生義", word: "plastic / plastic surgery", syllable: "plas · tic ['plæstɪk]", shortAns: "adj. 塑膠製的；易塑形的 ＆ n. 整形手術", meaning: "plastic adj. 塑膠的；可塑的；plastic surgery 整形手術；plastic n. 塑膠", hack: "<b>plastic</b> 原義為「可塑形的」➔ <b>plastic surgery</b> 指整形手術（重塑外貌）！", example: "Many cosmetic clinics offer plastic surgery to alter facial features. (L5 p.107)" },
      { id: "c_1108_37", pack: "lichi_1108", packName: "李奇 11/08", cat: "chunks", catName: "🔗 必考片語", word: "at one's convenience", syllable: "con · ven · ience", shortAns: "在某人方便的時候（常用於商務/禮貌書信）", meaning: "phr. 在您方便的時候 (= when it is convenient for you)", hack: "書信必背：<b>Please reply at your earliest convenience.</b>（請儘速在您方便時回覆）。", example: "Feel free to call me back at your convenience. (L5 p.107)" },
      { id: "c_1108_38", pack: "lichi_1108", packName: "李奇 11/08", cat: "chunks", catName: "🔗 必考片語", word: "eager / be eager for (sth / to V)", syllable: "ea · ger ['iɡɚ]", shortAns: "adj. 熱切的、渴望的（be eager to V / for N）", meaning: "adj. 熱切渴望的；副詞 eagerly 渴望地；名詞 eagerness 渴望", hack: "課本片語：<b>be eager for sth</b>（渴望某物）；<b>be eager to V</b>（渴望去做...）。", example: "Rick is eagerly waiting for his boss to approve his vacation request. (L5 p.107)" },
      { id: "c_1108_39", pack: "lichi_1108", packName: "李奇 11/08", cat: "phonics", catName: "🔤 單字與音節", word: "surroundings (恆用複數)", syllable: "sur · round · ings", shortAns: "n. pl. 周圍環境、周圍事物（字尾必加 s）", meaning: "n. (恆用複數) 周圍環境、周遭事物", hack: "<b>surround</b> 是動詞「環繞」；加上 -ings 變成<b>恆用複數名詞</b> <b>surroundings</b> 指生活環境！", example: "Animals blend into their natural surroundings to avoid being spotted by predators. (L5 p.108)" },
      { id: "c_1108_40", pack: "lichi_1108", packName: "李奇 11/08", cat: "roots", catName: "⚠️ 熟詞生義", word: "consume / consumer / consumption", syllable: "con · sume [kən'sum]", shortAns: "v. 吃喝；消耗、耗費 ＆ n. 消費者 ＆ n. 消耗量", meaning: "consume v. 消耗(能源/時間)；吃喝；consumer n. 消費者；consumption n. 消耗量", hack: "<b>consume time / energy</b>（消耗時間精力）；開車前不要 <b>consume alcohol</b>（飲酒）！", example: "Finishing his weekly assignments consumes most of his weekend time. (L5 p.110)" },
      { id: "c_1108_41", pack: "lichi_1108", packName: "李奇 11/08", cat: "chunks", catName: "🔗 必考片語", word: "come along (龍騰 L5 片語 1)", syllable: "come · a · long", shortAns: "到達、出現；隨同、跟著一起來", meaning: "phr. 出現、到來 (= arrive / appear)；隨同前往", hack: "課本真題：機會或幫手「出現」用 <b>come along</b>；<b>Wait until a better opportunity comes along.</b>", example: "Luckily, when we moved, some friends came along and helped us clean up. (L5 p.113)" },
      { id: "c_1108_42", pack: "lichi_1108", packName: "李奇 11/08", cat: "chunks", catName: "🔗 必考片語", word: "pack...up (龍騰 L5 片語 2)", syllable: "pack · up", shortAns: "收拾、打包（行李或隨身物品）", meaning: "phr. 收拾、打包(行李)；代名詞放中間 pack it up", hack: "離職或搬家打包：<b>pack up all his things</b>；可分雙字動詞，代名詞必放中間 <b>pack them up</b>！", example: "After he got fired, he sadly packed up all his belongings and left. (L5 p.114)" },
      { id: "c_1108_43", pack: "lichi_1108", packName: "李奇 11/08", cat: "chunks", catName: "🔗 必考片語", word: "on one's own (龍騰 L5 片語 3)", syllable: "on · one's · own", shortAns: "獨自一人、靠自己 (= by oneself / alone)", meaning: "phr. 獨自、靠自己、無人協助 (= independently / by oneself)", hack: "同義抽換必考：<b>on his own = by himself</b>；介系詞用 <b>on</b>！", example: "Tim finished all the work on his own because his colleagues were stuck in traffic. (L5 p.114)" },
      { id: "c_1108_44", pack: "lichi_1108", packName: "李奇 11/08", cat: "chunks", catName: "🔗 必考片語", word: "for a while (龍騰 L5 片語 4)", syllable: "for · a · while", shortAns: "一陣子、一段時間（修飾時間長度）", meaning: "phr. 一陣子、一段時間；for quite a while 相當長的一段時間", hack: "<b>for a while</b> 是時間副詞片語；若換成連詞是 <b>while S + V</b>。", example: "After a hard day's work, she could finally sit down and rest for a while. (L5 p.114)" },
      { id: "c_1108_45", pack: "lichi_1108", packName: "李奇 11/08", cat: "chunks", catName: "🔗 必考片語", word: "end up (+ V-ing / prep / adj) (龍騰 L5 片語 5)", syllable: "end · up", shortAns: "最後結果是...、落得...下場", meaning: "phr. 最後落得...下場、最終結果是（常接 V-ing 或介系詞片語）", hack: "大考超高頻：<b>end up paying a fine</b>（最後落得付罰款）；<b>end up in prison</b>（最後鋃鐺入獄）！", example: "The mayor ended up in prison for accepting bribes. (L5 p.114)" },
      { id: "c_1108_46", pack: "lichi_1108", packName: "李奇 11/08", cat: "grammar", catName: "⚡ 文法秒殺", word: "使役動詞主動 vs. 被動 (make/have/let)", syllable: "make · have · let", shortAns: "主動叫某人做接 VR ｜ 被動事物被做接 p.p.", meaning: "S + make/have/let + O + VR (主動) ｜ S + have/get + O + p.p. (被動受詞被處理)", hack: "課本句型：The police officer <b>made him show</b> his license.（叫他拿駕照 ➔ 接原形 VR）！", example: "Our teacher had us memorize twenty new words every day. (L5 p.115)" },
      // ==========================================================================
      // 🎯 李奇 11/01 考後：Gordon 圈字＋錯題考點 (共 23 張)
      // ==========================================================================
      { id: "c_1101x_01", pack: "lichi_1101x", packName: "11/01 考後", cat: "roots", catName: "⚠️ 熟詞生義", word: "measure (n.)", syllable: "meas · ure ['mɛʒɚ]", shortAns: "n. 措施、手段 ／ v. 測量", meaning: "n. 措施、手段；v. 測量", hack: "文意選填 Q27：<b>Another important measure is to...</b>（另一項重要措施是...）。常考 <b>take measures to V</b>（採取措施去做...）。", example: "Another important measure is to improve communication between schools and the police. (Q27 圈字)" },
      { id: "c_1101x_02", pack: "lichi_1101x", packName: "11/01 考後", cat: "phonics", catName: "🔤 單字與音節", word: "possession", syllable: "pos · ses · sion [pə'zɛʃən]", shortAns: "n. 持有、擁有；財產", meaning: "n. 持有、擁有；（複數）財產", hack: "<b>possess</b>（v. 擁有）➔ <b>possession</b>（n.）。注意 <b>ss · ss</b> 兩組雙 s！片語 <b>in possession of</b>（持有...）。", example: "New regulations may make possession of electronic cigarettes illegal. (Q34 錯題＋圈字)" },
      { id: "c_1101x_03", pack: "lichi_1101x", packName: "11/01 考後", cat: "roots", catName: "⚠️ 熟詞生義", word: "substances", syllable: "sub · stan · ces ['sʌbstənsɪz]", shortAns: "n. 物質；（管制）藥物", meaning: "n. 物質；（新聞中常指）管制藥物、毒品", hack: "<b>sub-</b>（在下面）+ <b>stance</b>（站立）➔ 底層的東西 = 物質。新聞常見 <b>controlled substances</b>（管制藥品）。", example: "Some substances related to etomidate may also be placed under stricter drug controls. (Q35 錯題＋圈字)" },
      { id: "c_1101x_04", pack: "lichi_1101x", packName: "11/01 考後", cat: "roots", catName: "🧩 字根拆解", word: "autonomy", syllable: "au · ton · o · my [ɔ'tɑnəmɪ]", shortAns: "n. 自主權、自治", meaning: "n. 自主權、自治權", hack: "<b>auto</b>（自己）+ <b>nomy</b>（法則）➔ 自己訂規則 = 自主權！形容詞 <b>autonomous</b>（自主的，如 autonomous cars 自駕車）。", example: "...while respecting students' rights and school autonomy. (Q33 錯題＋圈字)" },
      { id: "c_1101x_05", pack: "lichi_1101x", packName: "11/01 考後", cat: "phonics", catName: "🔤 單字與音節", word: "personnel", syllable: "per · son · nel [ˌpɝsə'nɛl]", shortAns: "n. （全體）人員、員工", meaning: "n. （集合名詞）全體人員、員工", hack: "重音在最後 <b>-NEL</b>，雙寫 <b>nn</b>！不要和 <b>personal</b>（adj. 個人的，重音在前）搞混。", example: "a new security force made up of retired military and police personnel. (Q28 錯題)" },
      { id: "c_1101x_06", pack: "lichi_1101x", packName: "11/01 考後", cat: "chunks", catName: "🔗 必考片語", word: "identify (students at risk)", syllable: "i · den · ti · fy [aɪ'dɛntəˌfaɪ]", shortAns: "v. 辨識、找出", meaning: "v. 辨識、找出、確認身分", hack: "助動詞 could 後接<b>原形動詞</b> + 受詞 ➔ <b>identify students who...</b>（找出...的學生）。另有 <b>identify with</b>（認同）。", example: "Schools could also identify students who may be at greater risk of using drugs. (Q32 錯題)" },
      { id: "c_1101x_07", pack: "lichi_1101x", packName: "11/01 考後", cat: "roots", catName: "🧩 字根拆解", word: "infiltration", syllable: "in · fil · tra · tion", shortAns: "n. 滲透、潛移默化地進入", meaning: "n. 滲透、潛入", hack: "<b>in-</b>（進入）+ <b>filtr</b>（過濾）➔ 像水慢慢滲入！句型 <b>the infiltration of A into B</b>。campaign 是有組織的活動。", example: "The infiltration of foreign ideas into the local culture has gradually changed young people. (Q18 錯題)" },
      { id: "c_1101x_08", pack: "lichi_1101x", packName: "11/01 考後", cat: "chunks", catName: "🔗 必考片語", word: "manage to V", syllable: "man · age ['mænɪdʒ]", shortAns: "設法成功做到（一字多義）", meaning: "phr. 設法成功做到...（manage 不只是管理）", hack: "一字多義：<b>manage to V</b> = 設法做到！<b>conquer</b>（征服）後面不能接 to V。", example: "Without any formal training, the boy managed to compose a symphony. (Q23 錯題)" },
      { id: "c_1101x_09", pack: "lichi_1101x", packName: "11/01 考後", cat: "chunks", catName: "🔗 必考片語", word: "bare one's soul (to sb)", syllable: "bare · one's · soul", shortAns: "向某人敞開心扉、傾吐心聲", meaning: "phr. 向某人敞開心扉、傾吐心聲", hack: "把靈魂赤裸裸 (<b>bare</b>) 攤開！<b>bang</b> 是猛撞，不能接 soul。片語要整串說出來！", example: "Since Sarah and I don't know each other well, I certainly won't bare my soul to her. (Q2 錯題)" },
      { id: "c_1101x_10", pack: "lichi_1101x", packName: "11/01 考後", cat: "roots", catName: "⚠️ 熟詞生義", word: "on the basis of vs. the basics of", syllable: "ba · sis ／ ba · sics", shortAns: "根據…（basis）vs. …的基礎知識（basics）", meaning: "on the basis of 根據、基於；the basics of ...的基本功", hack: "前面有 <b>on the ___ of</b> ➔ 必填 <b>basis</b>（單數準則）；<b>basics</b> 是複數「基本功」。", example: "The teacher graded the projects on the basis of creativity, accuracy, and presentation skills. (Q6 錯題)" },
      { id: "c_1101x_11", pack: "lichi_1101x", packName: "11/01 考後", cat: "chunks", catName: "🔗 必考片語", word: "be baying for blood", syllable: "bay · ing · for · blood", shortAns: "群情激憤、要求嚴懲", meaning: "phr. （群眾）憤怒要求嚴懲", hack: "<b>bay</b> 原義是狗狼狂吠 ➔ 像狼群狂吠要見血 = 群情激憤要求嚴懲！", example: "The angry villagers were baying for blood after the official was caught accepting bribes. (Q7 錯題)" },
      { id: "c_1101x_12", pack: "lichi_1101x", packName: "11/01 考後", cat: "chunks", catName: "🔗 必考片語", word: "law enforcement (agents)", syllable: "en · force · ment", shortAns: "執法（單位）、執法人員", meaning: "n. 執法；law enforcement agents 執法人員", hack: "<b>en-</b>（使）+ <b>force</b>（力量）➔ <b>enforce</b> 強制執行 ➔ <b>law enforcement</b> 執法機關。", example: "When police or other law enforcement agents are investigating someone... (閱讀 圈字)" },
      { id: "c_1101x_13", pack: "lichi_1101x", packName: "11/01 考後", cat: "phonics", catName: "🔤 單字與音節", word: "evidence", syllable: "ev · i · dence ['ɛvədəns]", shortAns: "n. 證據（不可數）", meaning: "n. 證據（不可數名詞）", hack: "不可數！要說 <b>a piece of evidence</b>（一項證據）。搭配 <b>produce evidence</b>（提出證據）。", example: "they need to produce evidence. Each piece of evidence is of crucial importance. (閱讀 圈字)" },
      { id: "c_1101x_14", pack: "lichi_1101x", packName: "11/01 考後", cat: "phonics", catName: "🔤 單字與音節", word: "poisonous", syllable: "poi · son · ous ['pɔɪzənəs]", shortAns: "adj. 有毒的", meaning: "adj. 有毒的", hack: "<b>poison</b>（毒）+ <b>-ous</b>（充滿...的）。<b>the fruit of the poisonous tree</b> = 毒樹果實（非法取得的證據）。", example: "something called the fruit of the poisonous tree doctrine. (閱讀 圈字)" },
      { id: "c_1101x_15", pack: "lichi_1101x", packName: "11/01 考後", cat: "roots", catName: "🧩 字根拆解", word: "doctrine", syllable: "doc · trine ['dɑktrɪn]", shortAns: "n. 原則、學說、教條", meaning: "n. （法律或宗教的）原則、學說", hack: "<b>doc</b>（教導，同 doctor）➔ 被教導的原則 = 學說、原則。", example: "This doctrine states that any evidence acquired illegally is not acceptable in court. (閱讀 圈字)" },
      { id: "c_1101x_16", pack: "lichi_1101x", packName: "11/01 考後", cat: "roots", catName: "⚠️ 熟詞生義", word: "indicator", syllable: "in · di · ca · tor", shortAns: "n. （汽車）方向燈；指標", meaning: "n. 指標；【熟詞生義】汽車方向燈", hack: "<b>indicate</b>（指出）+ <b>-or</b> ➔ 指出方向的東西 = 方向燈！<b>put on his indicator</b> = 打方向燈。", example: "Mr. Smith forgot to put on his indicator as he was making a turn. (閱讀 圈字)" },
      { id: "c_1101x_17", pack: "lichi_1101x", packName: "11/01 考後", cat: "roots", catName: "🧩 字根拆解", word: "admissible", syllable: "ad · mis · si · ble", shortAns: "adj. （證據）可被採納的", meaning: "adj. （法庭上證據）可採納的、可接受的", hack: "<b>admit</b>（允許進入）+ <b>-ible</b>（可...的）➔ 可被允許的。<b>not admissible as evidence</b> = 不能當作證據。", example: "the judge rules that the drugs are not admissible as evidence. (閱讀 圈字)" },
      { id: "c_1101x_18", pack: "lichi_1101x", packName: "11/01 考後", cat: "chunks", catName: "🔗 必考片語", word: "get (criminal) charges dropped", syllable: "charg · es · dropped", shortAns: "讓（刑事）指控被撤銷", meaning: "phr. 讓指控被撤銷；drop charges 撤銷告訴", hack: "<b>charge</b> 在法律新聞 = 指控、罪名；<b>drop the charges</b> = 撤銷指控。", example: "evidence—even a bag of drugs—can get all criminal charges dropped. (Q36 錯題)" },
      { id: "c_1101x_19", pack: "lichi_1101x", packName: "11/01 考後", cat: "grammar", catName: "⚡ 文法秒殺", word: "Two years from now + will be V-ing", syllable: "未來進行式", shortAns: "未來某時間點正在做（未來進行式）", meaning: "未來某時間點正在進行 ➔ will be V-ing", hack: "<b>Two years from now</b> = 未來某時間點 ➔ <b>will be preparing</b>（正在準備）。<b>will have p.p.</b> 要搭 <b>by + 未來時間</b>。", example: "Two years from now, I will be preparing for the college entrance exam. (Q46 錯題)" },
      { id: "c_1101x_20", pack: "lichi_1101x", packName: "11/01 考後", cat: "grammar", catName: "⚡ 文法秒殺", word: "專有名詞 + , which", syllable: "非限定關代", shortAns: "獨一無二的先行詞 ➔ 用逗號 + which", meaning: "專有名詞／獨一無二的先行詞 ➔ 非限定用法 , which", hack: "先行詞是電影名稱 <b>The Greatest Showman</b>（獨一無二）➔ 只能用 <b>, which</b> 補充說明。<b>that 前面不能加逗號</b>！", example: "the director of the movie The Greatest Showman, which had amazed audiences worldwide. (Q58 錯題)" },
      { id: "c_1101x_21", pack: "lichi_1101x", packName: "11/01 考後", cat: "grammar", catName: "⚡ 文法秒殺", word: "the impression that + 完整句", syllable: "同位語子句", shortAns: "that 引導同位語，說明名詞的內容", meaning: "impression / fact / idea / news + that + 完整句（同位語）", hack: "<b>give sb the impression that S + V</b>：that 子句說明「印象的內容」。in which 語意不通。", example: "beavers give us the impression that they are always on the move. (Q61 錯題)" },
      { id: "c_1101x_22", pack: "lichi_1101x", packName: "11/01 考後", cat: "grammar", catName: "⚡ 文法秒殺", word: "avoid exposing oneself to", syllable: "avoid + V-ing", shortAns: "避免使自己暴露於…（avoid + V-ing）", meaning: "avoid + V-ing；expose oneself to sth = be exposed to sth", hack: "<b>avoid</b> 後接 <b>V-ing</b>；<b>expose</b> 是及物動詞，要有受詞 ➔ <b>exposing themselves to</b>。", example: "allows many species to avoid exposing themselves to harsh environmental changes. (Q64 錯題)" },
      { id: "c_1101x_23", pack: "lichi_1101x", packName: "11/01 考後", cat: "phonics", catName: "🔤 單字與音節", word: "progress", syllable: "prog · ress ['prɑɡrɛs]", shortAns: "n. 進步、進展（不可數）", meaning: "n. 進步、進展（不可數）；v. 進步（重音在後）", hack: "名詞重音在前 <b>'PROG-ress</b>，動詞重音在後。和 <b>history, values</b> 並列，都是抽象名詞。", example: "banknotes can reveal a great deal about a country's history, progress, and values. (Q54 空白)" },

      // ==========================================================================
      // 🆕 本週最新進度：李奇 11/01 (9000單 B篇 p.26–30, 共 28 張)
      // ==========================================================================
      { id: "c_1101_01", pack: "lichi_1101", packName: "李奇 11/01", cat: "phonics", catName: "🔤 單字與音節", word: "baggage", syllable: "bag · gage ['bæɡɪdʒ]", shortAns: "n. 行李（不可數名詞）", meaning: "n. 行李（不可數，常指隨身或托運行李）", hack: "<b>bag</b>（袋子）+ <b>-age</b>（集合名詞字尾，雙寫 g）➔ 各種袋子合起來就是「行李」！", example: "Security officers scanned the baggage for any prohibited items. (p.26)" },
      { id: "c_1101_02", pack: "lichi_1101", packName: "李奇 11/01", cat: "chunks", catName: "🔗 必考片語", word: "bait / bait sb into V-ing", syllable: "bait [bet]", shortAns: "n. 誘餌、圈套 ／ v. 引誘、激怒某人做...", meaning: "n. 魚餌、誘餌、圈套；v. 引誘、故意激怒", hack: "必背搭配：<b>bait him into losing his temper</b>（設圈套引誘／激怒他發脾氣）！", example: "They tried to bait him into losing his temper during the debate. (p.26)" },
      { id: "c_1101_03", pack: "lichi_1101", packName: "李奇 11/01", cat: "phonics", catName: "🔤 單字與音節", word: "bake & bakery", syllable: "bake [bek] ／ ba · ker · y ['bekərɪ]", shortAns: "v./n. 烘烤、烘焙食品 ＆ n. 麵包店", meaning: "bake v. 烘烤、n. 烘烤食品；bakery n. 麵包店", hack: "<b>bake</b>（烤）+ <b>-ery</b>（場所）= <b>bakery</b>（麵包店）。搭配：<b>freshly baked bread</b>（剛出爐的麵包）。", example: "The local bakery sells freshly baked bread and pastries every morning. (p.26)" },
      { id: "c_1101_04", pack: "lichi_1101", packName: "李奇 11/01", cat: "roots", catName: "⚠️ 熟詞生義", word: "balance (一詞多義)", syllable: "bal · ance ['bæləns]", shortAns: "n./v. 平衡；銀行存款「餘額」、欠款差額", meaning: "v./n. 平衡；n. 【熟詞生義】銀行存款餘額、欠款差額", hack: "除了「平衡」，在銀行或帳單中指「<b>餘額／尾款</b>」：<b>check my bank balance</b>（查存款餘額）、<b>The balance is due</b>（尾款到期應繳）。", example: "I called the bank to check my bank balance yesterday. (p.26)" },
      { id: "c_1101_05", pack: "lichi_1101", packName: "李奇 11/01", cat: "chunks", catName: "🔗 必考片語", word: "strike a balance / a sense of balance", syllable: "strike · a · bal · ance", shortAns: "取得平衡（動詞必搭 strike）＆ 平衡感", meaning: "phr. (在 A 與 B 之間) 取得平衡 ／ 平衡感", hack: "大考翻譯必背：在課業與社團間「取得平衡」動詞要用 <b>strike a balance between A and B</b>！", example: "It is a great challenge to strike a balance between schoolwork and extracurricular activities. (102指考, p.26)" },
      { id: "c_1101_06", pack: "lichi_1101", packName: "李奇 11/01", cat: "phonics", catName: "🔤 單字與音節", word: "balcony", syllable: "bal · co · ny ['bælkənɪ]", shortAns: "n. 陽臺、露臺", meaning: "n. 陽臺；露臺", hack: "音節切三段：<b>bal · co · ny</b>（陽臺）。搭配：<b>lean over the balcony railing</b>（探過陽台欄杆）。", example: "She leaned over the balcony railing, watching the street below. (p.27)" },
      { id: "c_1101_07", pack: "lichi_1101", packName: "李奇 11/01", cat: "phonics", catName: "🔤 單字與音節", word: "ballet & balloon", syllable: "bal · let ['bæle] ／ bal · loon [bə'lun]", shortAns: "n. 芭蕾舞（字尾 t 不發音）＆ n. 氣球", meaning: "ballet n. 芭蕾舞；balloon n. 氣球", hack: "<b>ballet</b> 源自法文，字尾 <b>-et 念 /e/（t 不發音）</b>；<b>balloon</b> 注意中間雙寫 <b>ll</b> 與 <b>oo</b>！", example: "The ballet dancer gave a bewilderingly elegant performance. (p.27)" },
      { id: "c_1101_08", pack: "lichi_1101", packName: "李奇 11/01", cat: "phonics", catName: "🔤 單字與音節", word: "bamboo", syllable: "bam · boo [bæm'bu]", shortAns: "n. 竹、竹子（重音在第二音節 -boo）", meaning: "n. 竹；竹子", hack: "重音在後面 <b>bam-'boo</b>！例句必背搭配：<b>rely on bamboo as their primary food source</b>（以竹子為主食）。", example: "Pandas rely on bamboo as their primary food source. (p.27)" },
      { id: "c_1101_09", pack: "lichi_1101", packName: "李奇 11/01", cat: "chunks", catName: "🔗 必考片語", word: "bang (against)", syllable: "bang [bæŋ]", shortAns: "v. 猛烈撞擊、發出砰聲 ／ n. 砰的一聲、巨響", meaning: "v. 發出砰的一聲、猛烈撞擊；n. 砰的一聲、槍響", hack: "撞上某物介系詞搭 <b>against</b>：<b>banged his knee against the table</b>（膝蓋撞到桌子）；<b>the sudden bang of gunfire</b>（突然槍響）。", example: "He accidentally banged his knee against the table and winced in pain. (p.27)" },
      { id: "c_1101_10", pack: "lichi_1101", packName: "李奇 11/01", cat: "phonics", catName: "🔤 單字與音節", word: "banker", syllable: "bank · er ['bæŋkɚ]", shortAns: "n. 銀行家、銀行高層主管", meaning: "n. 銀行家", hack: "<b>bank</b>（銀行）+ <b>-er</b>（人）= <b>banker</b>（銀行家）。複習 105 學測同句高頻字：<b>compensate for</b>（彌補損失）。", example: "Bill and Sam decided to kidnap the son of a banker to compensate for their business loss. (105學測, p.27)" },
      { id: "c_1101_11", pack: "lichi_1101", packName: "李奇 11/01", cat: "chunks", catName: "🔗 必考片語", word: "bar / behind bars", syllable: "be · hind · bars", shortAns: "n. 棒條、鐵柵、酒吧 ／ behind bars 坐牢", meaning: "bar n. 棒條(chocolate bar)、鐵柵欄、酒吧；behind bars 坐牢", hack: "<b>bars</b> 指監獄窗戶上的「長條鐵柵欄」，在鐵欄杆後面 <b>behind bars = 坐牢、在監獄服刑</b>！", example: "He's spent most of his life behind bars. (p.27)" },
      { id: "c_1101_12", pack: "lichi_1101", packName: "李奇 11/01", cat: "phonics", catName: "🔤 單字與音節", word: "barbecue & barber", syllable: "bar · be · cue ['bɑrbɪkju] ／ bar · ber ['bɑrbɚ]", shortAns: "n./v. 燒烤、烤肉 ＆ n. 理髮師", meaning: "barbecue n./v. 燒烤、烤肉；barber n. 理髮師", hack: "<b>bar · be · cue</b>（注意字尾是 <b>-cue</b> 不是 -que）；<b>bar · ber</b> 是剪頭髮的「理髮師」。", example: "We'll barbecue tonight if the weather is nice. / I asked the barber to cut my hair. (p.27)" },
      { id: "c_1101_13", pack: "lichi_1101", packName: "李奇 11/01", cat: "roots", catName: "⚠️ 熟詞生義", word: "bare (adj. & v.)", syllable: "bare [bɛr]", shortAns: "adj. 赤裸的、（貨架）空無一物的 ／ v. 露出(牙齒)", meaning: "adj. 光禿的、赤裸的、(櫥櫃/貨架)空無一物的；v. 使暴露、露出", hack: "112學測考 <b>find the shelves almost bare</b>（發現貨架幾乎空空如也）；<b>with bare feet</b>（赤腳）；動詞 <b>bared its teeth</b>（狗露出尖牙）。", example: "Nancy rushed to the supermarket—only to find the shelves almost bare. (112學測, p.28)" },
      { id: "c_1101_14", pack: "lichi_1101", packName: "李奇 11/01", cat: "chunks", catName: "🔗 必考片語", word: "bare one's heart / soul", syllable: "bare · one's · soul", shortAns: "打開心扉、傾吐心聲", meaning: "phr. 打開心扉；毫無保留地傾吐心聲", hack: "把內心／靈魂「赤裸裸地敞開 (<b>bare</b>)」➔ <b>bare one's heart / soul</b>（敞開心扉、傾吐心聲）！", example: "The writer bared his soul in his novel. (p.28)" },
      { id: "c_1101_15", pack: "lichi_1101", packName: "李奇 11/01", cat: "roots", catName: "⚠️ 熟詞生義", word: "barely", syllable: "bare · ly ['bɛrlɪ]", shortAns: "adv. 幾乎不、勉強才（具否定意味）", meaning: "adv. 幾乎不、勉強才 (= hardly / scarcely)", hack: "注意！<b>bare</b> 是赤裸的，但加 -ly 變成 <b>barely</b> 是「<b>幾乎不、差點就不能</b>」（否定副詞）！", example: "Amelia barely had any money left for entertainment. (106學測) / He could barely stand. (p.28)" },
      { id: "c_1101_16", pack: "lichi_1101", packName: "李奇 11/01", cat: "roots", catName: "⚠️ 熟詞生義", word: "bark (一詞多義)", syllable: "bark [bɑrk]", shortAns: "v./n. (狗)吠叫；n. 樹皮 ／ v. 剝樹皮", meaning: "v./n. 吠叫；n. 【熟詞生義】樹皮；v. 剝去(樹)的皮", hack: "自然科普文章看到 <b>bark</b> 絕不是狗叫，而是「<b>樹皮</b>」：<b>The outer bark insulates the tree</b>（外層樹皮隔熱保水）！", example: "The outer bark insulates the tree from extreme temperatures and reduces water loss. (p.28)" },
      { id: "c_1101_17", pack: "lichi_1101", packName: "李奇 11/01", cat: "phonics", catName: "🔤 單字與音節", word: "barn", syllable: "barn [bɑrn]", shortAns: "n. 穀倉、畜舍、馬廄", meaning: "n. 穀倉；畜舍；馬廄", hack: "注意區分：<b>bark</b>（吠叫／樹皮）、<b>bare</b>（赤裸的）、<b>barn</b>（結尾 n ➔ 農場裡的穀倉／馬廄）！", example: "He is feeding the horses in the barn. (p.28)" },
      { id: "c_1101_18", pack: "lichi_1101", packName: "李奇 11/01", cat: "chunks", catName: "🔗 必考片語", word: "barrel / One rotten apple spoils the barrel", syllable: "bar · rel ['bærəl]", shortAns: "n. 桶（a barrel of oil）＆ 諺語：一顆老鼠屎壞了一鍋粥", meaning: "barrel n. 大桶(一桶石油 a barrel of oil)；【諺】一顆爛蘋果壞了一整桶", hack: "必背諺語：<b>One rotten apple spoils the barrel.</b>（一顆爛蘋果毀掉整桶 ➔ 一顆老鼠屎壞了一整鍋粥）！", example: "How much is a barrel of oil? / One rotten apple spoils the barrel. (p.28)" },
      { id: "c_1101_19", pack: "lichi_1101", packName: "李奇 11/01", cat: "roots", catName: "⚠️ 熟詞生義", word: "base (基礎 vs. 卑鄙的)", syllable: "base [bes]", shortAns: "n. 基地、基礎、湯底 ／ adj. 卑鄙的、不道德的", meaning: "n. 基地、基礎、湯底；v. 以...為基礎；adj. 【高頻熟詞生義】卑鄙的", hack: "大考殺手題：<b>base</b> 當形容詞除了「基礎的」，還常考「<b>低下卑鄙的</b>」：<b>base intentions</b>（卑鄙的意圖）！", example: "The politician's base intentions became clear when he manipulated the facts. (p.29)" },
      { id: "c_1101_20", pack: "lichi_1101", packName: "李奇 11/01", cat: "chunks", catName: "🔗 必考片語", word: "based on... / service-based", syllable: "based · on", shortAns: "基於...、根據... ＆ 以服務為基礎的", meaning: "phr. 基於...、以...為根據 (= on the basis of)", hack: "句首或句中修飾時直接用過去分詞 <b>based on + N</b>；複合形容詞寫 <b>service-based businesses</b>（服務型企業，113學測）。", example: "based on information coming from other members. (113學測, p.29)" },
      { id: "c_1101_21", pack: "lichi_1101", packName: "李奇 11/01", cat: "phonics", catName: "🔤 單字與音節", word: "basement", syllable: "base · ment ['besmənt]", shortAns: "n. 地下室", meaning: "n. 地下室", hack: "<b>base</b>（底部地基）+ <b>-ment</b> = <b>basement</b>（建築物最底層的地下室）。", example: "Since the typhoon, the basement has been filled with water. (91學測, p.29)" },
      { id: "c_1101_22", pack: "lichi_1101", packName: "李奇 11/01", cat: "chunks", catName: "🔗 必考片語", word: "basic (adj.) & basics (n. pl.)", syllable: "ba · sic ['besɪk] ／ ba · sics", shortAns: "adj. 基本的 ＆ n. pl. 基礎知識、基本原理", meaning: "basic adj. 基本的；basics n. pl. 基礎知識、基本原理", hack: "<b>basic</b> 加 <b>s</b> 變複數名詞 <b>the basics of...</b>（...的基礎知識／基本功）！", example: "Understanding the basics of grammar is essential for improving writing skills. (p.29)" },
      { id: "c_1101_23", pack: "lichi_1101", packName: "李奇 11/01", cat: "chunks", catName: "🔗 必考片語", word: "basis / on the basis of...", syllable: "ba · sis ['besɪs]", shortAns: "n. 基礎、準則 ＆ on the basis of 基於...", meaning: "basis n. 基礎、準則；on the basis of... 基於... (= based on...)", hack: "<b>form the basis for...</b>（成為...的基礎，104學測）；<b>on the basis of + N</b> = <b>based on + N</b>（基於...）。", example: "They hired him on the basis of his exceptional problem-solving skills. (p.30)" },
      { id: "c_1101_24", pack: "lichi_1101", packName: "李奇 11/01", cat: "chunks", catName: "🔗 必考片語", word: "on a regular / daily basis", syllable: "on · a · reg · u · lar · ba · sis", shortAns: "定期地（regular） ／ 每天（daily）", meaning: "phr. 定期地 (= regularly) ／ 每天、日常地 (= daily)", hack: "介系詞永遠用 <b>on</b>：<b>on a regular basis</b>（定期地）、<b>on a daily/weekly/monthly/yearly basis</b>！", example: "The team meets on a regular basis to discuss progress. (p.30)" },
      { id: "c_1101_25", pack: "lichi_1101", packName: "李奇 11/01", cat: "phonics", catName: "🔤 單字與音節", word: "bathe", syllable: "bathe [beð] (動詞字尾有 e)", shortAns: "v. 沐浴在(陽光)中、浸泡、給...洗澡", meaning: "v. 把...浸入...；給...洗澡；沉浸/沐浴在(陽光)中", hack: "區分：<b>bath [bæθ]</b> 是名詞；加 e 變動詞 <b>bathe [beð]</b>！搭配：<b>bathe in the warm sunlight</b>（沐浴在溫暖陽光下）。", example: "She decided to bathe in the warm sunlight streaming through the window. (p.30)" },
      { id: "c_1101_26", pack: "lichi_1101", packName: "李奇 11/01", cat: "phonics", catName: "🔤 單字與音節", word: "battle", syllable: "bat · tle ['bæt!]", shortAns: "n. 戰役、長期奮鬥 ／ v. 與...作戰、搏鬥", meaning: "n. 戰鬥、戰役；v. 與...鬥爭、作戰、奮鬥", hack: "109學測考 <b>a constant battle to V</b>（為了...而不斷進行的艱苦奮戰）；動詞直接加受詞 <b>battle fierce opponents</b>。", example: "This dietary need has led to a constant battle to keep the deer separate from the trains. (109學測, p.30)" },
      { id: "c_1101_27", pack: "lichi_1101", packName: "李奇 11/01", cat: "roots", catName: "⚠️ 熟詞生義", word: "bay (一詞多義)", syllable: "bay [be]", shortAns: "n. 海灣；(建築內的)專用分隔區(如修理區)；月桂樹", meaning: "n. 海灣；【熟詞生義】(工廠/機庫內的)限定專用區域；月桂樹", hack: "除了「海灣 (<b>anchored in the bay</b>)」，還指廠房內的專用隔間：<b>in the repair bay</b>（在修理區）／ <b>loading bay</b>（卸貨區）！", example: "The ship anchored in the bay. / The mechanic worked in the repair bay. (p.30)" },
      { id: "c_1101_28", pack: "lichi_1101", packName: "李奇 11/01", cat: "chunks", catName: "🔗 必考片語", word: "keep ... at bay / be at bay / bay for blood", syllable: "keep ... at · bay", shortAns: "阻止、遏制(問題或敵人逼近) ／ 被困住 ／ 要求嚴懲", meaning: "keep... at bay 阻止、遏制；be at bay (動物)被圍困；bay for blood 要求暴力相向", hack: "克漏字超高頻片語：<b>keep the disease / enemy at bay</b>（把疾病或敵人擋在安全距離外 ➔ 阻止、遏制）！", example: "Exercise and a healthy diet can help keep many diseases at bay. (p.31)" },

      // 📅 上週進度：李奇 10/25 (16 Cards)
      // ==========================================================================
      { id: "c_1025_01", pack: "lichi_1025", packName: "李奇 10/25", cat: "roots", catName: "⚠️ 熟詞生義", word: "undermine", syllable: "un · der · mine", shortAns: "暗中削弱、損害（信任或根基）", meaning: "v. 暗中削弱、損害（信任／威信／基礎）", hack: "<b>under</b>（在下面）+ <b>mine</b>（挖地道/地雷）➔ 從底部暗中挖空削弱！", example: "Spreading rumors will undermine public trust. (Q17/Q38)" },
      { id: "c_1025_02", pack: "lichi_1025", packName: "李奇 10/25", cat: "roots", catName: "⚠️ 熟詞生義", word: "supervision", syllable: "su · per · vi · sion", shortAns: "監督、管理、監管", meaning: "n. 監督、管理、監管", hack: "<b>super-</b>（在上方）+ <b>vis</b>（看）+ <b>-ion</b> ➔ 居高臨下往下看 ➔ 監督！", example: "Without proper parental supervision, teens may fall prey to scams. (Q18/Q39)" },
      { id: "c_1025_03", pack: "lichi_1025", packName: "李奇 10/25", cat: "roots", catName: "⚠️ 熟詞生義", word: "scaremonger", syllable: "scare · mon · ger", shortAns: "製造恐慌者、危言聳聽的人", meaning: "n. 製造恐慌者、危言聳聽的人", hack: "<b>scare</b>（恐嚇）+ <b>monger</b>（散播商人）➔ 專門散播恐慌賣焦慮的人！", example: "Don't listen to that online scaremonger! (Q19)" },
      { id: "c_1025_04", pack: "lichi_1025", packName: "李奇 10/25", cat: "chunks", catName: "🔗 必考片語", word: "YouTube personalities", syllable: "per · son · al · i · ties", shortAns: "知名網紅、風雲人物、名人", meaning: "n. 知名網紅、風雲人物、公眾名人", hack: "<b>熟詞生義</b>：personality 單數是個性，複數 <b>personalities</b> 指「名人、網紅」，絕非傀儡！", example: "Many famous YouTube personalities were invited to the launch. (Q27)" },
      { id: "c_1025_05", pack: "lichi_1025", packName: "李奇 10/25", cat: "chunks", catName: "🔗 必考片語", word: "tell A and B apart", syllable: "tell ... a · part", shortAns: "分辨、區分兩者真偽", meaning: "phr. 分辨、區分兩者 (= distinguish A from B)", hack: "<b>tell them apart</b> = 把兩者區分開來。（注意：take apart 是拆機器）", example: "Deepfakes are so realistic that it is hard to tell them apart. (Q28)" },
      { id: "c_1025_06", pack: "lichi_1025", packName: "李奇 10/25", cat: "chunks", catName: "🔗 必考片語", word: "lacks real proof", syllable: "lacks · real · proof", shortAns: "缺乏真實的證據", meaning: "phr. 缺乏真實的證據", hack: "<b>lack</b> 當及物動詞直接加受詞 <b>lack proof</b>；當名詞才寫 a lack of proof。", example: "The controversial claim completely lacks real proof. (Q26)" },
      { id: "c_1025_07", pack: "lichi_1025", packName: "李奇 10/25", cat: "roots", catName: "⚠️ 熟詞生義", word: "interaction", syllable: "in · ter · ac · tion", shortAns: "人際互動、交流", meaning: "n. 互動、交流", hack: "<b>inter-</b>（互相、在...之間）+ <b>act</b>（行動）➔ 人與人之間的互動！", example: "Genuine human interaction is irreplaceable. (Q34)" },
      { id: "c_1025_08", pack: "lichi_1025", packName: "李奇 10/25", cat: "roots", catName: "⚠️ 熟詞生義", word: "reject", syllable: "re · ject", shortAns: "拒絕、駁回、排斥", meaning: "v. 拒絕、駁回、排斥", hack: "<b>re-</b>（往回）+ <b>ject</b>（投擲、丟）➔ 把提案丟回去 ➔ 拒絕、駁回！", example: "The committee decided to reject the proposal. (Q36)" },
      { id: "c_1025_09", pack: "lichi_1025", packName: "李奇 10/25", cat: "roots", catName: "⚠️ 熟詞生義", word: "decline", syllable: "de · cline", shortAns: "下滑、衰退；婉拒", meaning: "v./n. 下滑、衰退；婉拒", hack: "<b>de-</b>（向下）+ <b>cline</b>（傾斜）➔ 往下傾斜 ➔ 分數下滑、衰退！", example: "Test scores have declined in those districts. (Q33)" },
      { id: "c_1025_10", pack: "lichi_1025", packName: "李奇 10/25", cat: "chunks", catName: "🔗 必考片語", word: "nationwide debate", syllable: "de · bate", shortAns: "全國性的辯論、爭論", meaning: "n./v. （全國性的）辯論、爭論", hack: "常搭 <b>spark / initiate a debate on...</b>（引發一場關於...的辯論）。", example: "The AI ban sparked a nationwide debate in Norway. (Q37)" },
      { id: "c_1025_11", pack: "lichi_1025", packName: "李奇 10/25", cat: "grammar", catName: "⚡ 文法秒殺", word: "Up to now + have/has p.p.", syllable: "現在完成式時間軸", shortAns: "直到目前為止（必搭現在完成式）", meaning: "直到目前為止 ➔ 主句必用「現在完成式」", hack: "看到 <b>Up to now / So far</b>，代表從過去累積到現在，必選 <b>have/has + p.p.</b>，不可用進行式！", example: "Up to now, the team has rescued 300 survivors. (Q42)" },
      { id: "c_1025_12", pack: "lichi_1025", packName: "李奇 10/25", cat: "grammar", catName: "⚡ 文法秒殺", word: "have gone to vs. have been to", syllable: "第一人稱 I 的時態悖論", shortAns: "去了沒回(gone to) vs. 去過已回(been to)", meaning: "說話者 I 絕不可說 I have gone to...", hack: "<b>have gone to</b> 是「去了還沒回來」，本人站在面前只能說 <b>I have been to...</b>（去過）！", example: "He has gone to the library. / I have been to Paris. (Q43)" },
      { id: "c_1025_13", pack: "lichi_1025", packName: "李奇 10/25", cat: "phonics", catName: "🔤 單字與音節", word: "diseases", syllable: "dis · eas · es", shortAns: "疾病（dis + ease 身體不適）", meaning: "n. 疾病 (複數)", hack: "<b>dis-</b>（不安）+ <b>ease</b>（舒適）= 疾病。記住 ease，絕不寫成 diseqe！", example: "protect your body from infectious diseases. (Q54)" },
      { id: "c_1025_14", pack: "lichi_1025", packName: "李奇 10/25", cat: "phonics", catName: "🔤 單字與音節", word: "exposure", syllable: "ex · po · sure", shortAns: "暴露、接觸（字首 ex- 不可漏）", meaning: "n. 暴露、接觸 (常配 to)", hack: "第一音節念 <b>/ɪk/ ➔ ex-</b>（向外）！千萬不可漏掉字首寫成 posur！", example: "Excessive exposure to sunlight can damage skin. (Q55)" },
      { id: "c_1025_15", pack: "lichi_1025", packName: "李奇 10/25", cat: "phonics", catName: "🔤 單字與音節", word: "assignments", syllable: "as · sign · ments", shortAns: "作業、指派的任務", meaning: "n. 作業、指派的任務", hack: "<b>as + sign（簽名標記）+ ment + s</b>，分三音節輕鬆拼出！", example: "submit weekly writing assignments before Friday. (Q51)" },
      { id: "c_1025_16", pack: "lichi_1025", packName: "李奇 10/25", cat: "phonics", catName: "🔤 單字與音節", word: "rewards", syllable: "re · wards", shortAns: "回報、獎賞、報酬", meaning: "n. 回報、獎賞、報酬", hack: "<b>re- + ward + s</b>（常搭 fruitful rewards / reap the rewards）。", example: "Hard work will bring fruitful rewards. (Q58)" },

      // ==========================================================================
      // 📅 前週進度：李奇 10/18 (12 Cards)
      // ==========================================================================
      { id: "c_1018_01", pack: "lichi_1018", packName: "李奇 10/18", cat: "chunks", catName: "🔗 必考片語", word: "associate with sb", syllable: "as · so · ci · ate", shortAns: "與某人交往、打交道（必搭 with）", meaning: "phr. 與某人交往；be associated with 與...有關", hack: "看到空格後有 <b>with</b> ➔ 秒選 <b>associate</b>！（attend to 才是照料）", example: "Few people like to associate with negative peers. (Q3)" },
      { id: "c_1018_02", pack: "lichi_1018", packName: "李奇 10/18", cat: "chunks", catName: "🔗 必考片語", word: "assume a serious look", syllable: "as · sume", shortAns: "擺出、呈現出（嚴肅的表情）", meaning: "phr. 擺出、呈現出（嚴肅的表情或態度）", hack: "<b>assume</b> 三大義：1. 假設 2. 承擔(責任) 3. <b>擺出(表情/樣子)</b>！", example: "Jeff assumed a serious look during the meeting. (Q6)" },
      { id: "c_1018_03", pack: "lichi_1018", packName: "李奇 10/18", cat: "chunks", catName: "🔗 必考片語", word: "attempt to escape", syllable: "at · tempt", shortAns: "企圖、嘗試逃跑", meaning: "phr. 企圖／嘗試做...", hack: "<b>attempt to V</b> = 企圖做...（注意區分警察逮捕 make an arrest）。", example: "The thief attempted to escape from the back door. (Q5)" },
      { id: "c_1018_04", pack: "lichi_1018", packName: "李奇 10/18", cat: "chunks", catName: "🔗 必考片語", word: "wait on sb", syllable: "wait · on", shortAns: "服侍、伺候（主人或客人）", meaning: "phr. 服侍、伺候（客人／主人）", hack: "<b>wait FOR</b> 是等待；<b>wait ON</b> 是當侍者服侍某人！", example: "They hired a servant to wait on the woman. (Q14)" },
      { id: "c_1018_05", pack: "lichi_1018", packName: "李奇 10/18", cat: "roots", catName: "⚠️ 熟詞生義", word: "overtake", syllable: "o · ver · take", shortAns: "超車、超越（在銷量或數量勝過）", meaning: "v. 超車、超越、勝過", hack: "<b>over</b>（越過）+ <b>take</b> ➔ 在後面追過去超車！（recruit 則是招募人才）", example: "EVs may eventually overtake traditional cars. (Q25)" },

      { id: "c_mid1_12", pack: "midterm1", packName: "一中一段", cat: "chunks", catName: "🔗 必考片語", word: "within walking distance of", syllable: "walk · ing · dis · tance", shortAns: "在步行可達（某地）的距離內", meaning: "phr. 在步行可達...的距離內", hack: "整串背：<b>live within walking distance of these stores</b>。", example: "It is convenient to live within walking distance of these stores." }
