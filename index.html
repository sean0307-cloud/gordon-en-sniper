<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Gordon閃卡" />
  <title>🌿 Gordon 專屬英文單卡記憶系統</title>
  <style>
    :root {
      --bg: #F5F4EF;
      --card: #FFFFFF;
      --text: #2C3539;
      --text-sub: #64748B;
      --primary: #3B6E8C;
      --primary-light: #EBF3F7;
      --green: #2E7D5B;
      --green-light: #E8F5EE;
      --amber: #C27803;
      --amber-light: #FEF6E7;
      --red: #C84B31;
      --red-light: #FDF0ED;
      --border: #E2E0D8;
      --shadow: 0 8px 24px rgba(44, 53, 57, 0.07);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 14px 14px 40px;
      max-width: 540px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Minimal Top Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .app-title {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .sync-pill {
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 99px;
      background: var(--green-light);
      color: var(--green);
      font-weight: 700;
      cursor: pointer;
    }

    /* Mode Switcher Bar (4 Clean Tabs) */
    .mode-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      background: #EAE8E0;
      padding: 4px;
      border-radius: 12px;
      margin-bottom: 12px;
    }
    .mode-btn {
      border: none;
      background: transparent;
      color: var(--text-sub);
      padding: 8px 4px;
      border-radius: 9px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .mode-btn.active {
      background: var(--card);
      color: var(--text);
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }
    .mode-count {
      font-size: 0.95rem;
      font-weight: 800;
    }

    /* Simple Dropdown Filters */
    .filter-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }
    .select-box {
      width: 100%;
      padding: 9px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 0.85rem;
      font-weight: 700;
      outline: none;
    }

    /* Progress Bar */
    .progress-wrap {
      margin-bottom: 12px;
    }
    .progress-info {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--text-sub);
      font-weight: 600;
      margin-bottom: 5px;
    }
    .progress-track {
      height: 8px;
      background: #E2E0D8;
      border-radius: 99px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--primary);
      border-radius: 99px;
      transition: width 0.3s ease;
    }

    /* ONE-CARD-AT-A-TIME FOCUS STAGE */
    .card-stage {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 22px 20px;
      box-shadow: var(--shadow);
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 410px;
    }

    .card-meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .meta-tag {
      font-size: 0.76rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 99px;
      background: var(--primary-light);
      color: var(--primary);
    }
    .status-tag {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-sub);
    }

    /* Word Hero Display */
    .word-hero {
      text-align: center;
      padding: 18px 8px 22px;
      border-bottom: 1px solid #F0EFEA;
      margin-bottom: 16px;
    }
    .word-main {
      font-size: 1.85rem;
      font-weight: 800;
      color: var(--text);
      letter-spacing: 0.3px;
      line-height: 1.25;
      margin-bottom: 8px;
      word-break: break-word;
    }
    .word-syllable {
      font-size: 1.02rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 12px;
    }
    .audio-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--primary-light);
      color: var(--primary);
      border: 1px solid #C5DCE8;
      padding: 7px 16px;
      border-radius: 99px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
    }
    .audio-btn:active { transform: scale(0.96); }

    /* STEP 1: Micro-Test Options (Anti-Blind-Click Gate) */
    .gate-title {
      font-size: 0.82rem;
      color: var(--text-sub);
      font-weight: 700;
      margin-bottom: 8px;
      text-align: center;
    }
    .opt-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .opt-btn {
      width: 100%;
      background: #FAF9F6;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      text-align: left;
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      transition: all 0.12s;
    }
    .opt-btn:hover { border-color: var(--primary); background: #FFFFFF; }
    .opt-btn:active { transform: scale(0.99); }

    .unsure-btn {
      margin-top: 8px;
      width: 100%;
      background: transparent;
      border: 1px dashed #CBD5E1;
      border-radius: 10px;
      padding: 9px;
      font-size: 0.82rem;
      color: var(--text-sub);
      font-weight: 600;
      cursor: pointer;
    }

    /* STEP 2: Revealed Back Explanation & Consequence Buttons */
    .reveal-box {
      display: none;
      animation: fadeIn 0.2s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .result-banner {
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 0.86rem;
      font-weight: 800;
      margin-bottom: 12px;
      text-align: center;
    }
    .result-banner.pass {
      background: var(--green-light);
      color: var(--green);
      border: 1px solid #B7E1CD;
    }
    .result-banner.fail {
      background: var(--amber-light);
      color: var(--amber);
      border: 1px solid #F6D8A6;
    }

    .meaning-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 8px;
      text-align: center;
    }
    .hack-card {
      background: #F8FAFC;
      border-left: 4px solid var(--primary);
      padding: 10px 12px;
      border-radius: 0 10px 10px 0;
      font-size: 0.88rem;
      color: var(--text);
      margin-bottom: 10px;
    }
    .example-line {
      font-size: 0.83rem;
      color: var(--text-sub);
      background: #F5F4EF;
      padding: 8px 10px;
      border-radius: 8px;
      margin-bottom: 14px;
    }

    /* Consequence Action Buttons */
    .action-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .conseq-btn {
      width: 100%;
      border-radius: 12px;
      padding: 12px 14px;
      border: 1.5px solid transparent;
      cursor: pointer;
      text-align: left;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: transform 0.1s;
    }
    .conseq-btn:active { transform: scale(0.98); }
    .c-main { font-size: 0.92rem; font-weight: 800; display: block; }
    .c-sub { font-size: 0.75rem; opacity: 0.85; display: block; margin-top: 2px; }
    .c-arrow { font-size: 1.1rem; font-weight: 800; }

    .btn-seal {
      background: var(--green-light);
      border-color: #9CD6B8;
      color: #1B5E3F;
    }
    .btn-keep {
      background: var(--amber-light);
      border-color: #F3CC8A;
      color: #8C5400;
    }
    .btn-sos {
      background: var(--red-light);
      border-color: #F2B8AC;
      color: #962D17;
    }

    /* Bottom Card Navigation (Prev / Next) */
    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .nav-btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text-sub);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
    }

    /* Report View */
    .report-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 12px;
      box-shadow: var(--shadow);
    }
    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 10px 0 14px;
    }
    .stat-item {
      background: #F8F7F3;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }
    .stat-item-val { font-size: 1.2rem; font-weight: 800; color: var(--primary); }
    .stat-item-lbl { font-size: 0.76rem; color: var(--text-sub); }

    .full-btn {
      width: 100%;
      padding: 11px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-weight: 700;
      font-size: 0.86rem;
      cursor: pointer;
      margin-bottom: 8px;
      text-align: center;
    }
    .full-btn.primary {
      background: var(--primary);
      color: #FFFFFF;
      border-color: var(--primary);
    }

    #toast {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      background: #2C3539;
      color: #FFFFFF;
      padding: 10px 16px;
      border-radius: 99px;
      font-size: 0.82rem;
      font-weight: 700;
      box-shadow: 0 6px 20px rgba(0,0,0,0.2);
      display: none;
      z-index: 999;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="app-title">🌿 Gordon 英文單卡記憶</div>
    <div id="sync-status" class="sync-pill" onclick="forceSync(true)">☁️ 自動同步中</div>
  </div>

  <!-- 4 Clean Mode Tabs -->
  <div class="mode-bar">
    <button class="mode-btn active" id="m-todo" onclick="switchMode('todo')">
      <span class="mode-count" id="num-todo">0</span>
      <span>🔥 待消滅</span>
    </button>
    <button class="mode-btn" id="m-sos" onclick="switchMode('sos')">
      <span class="mode-count" id="num-sos" style="color: var(--red);">0</span>
      <span>🛏️ 睡前急救</span>
    </button>
    <button class="mode-btn" id="m-mastered" onclick="switchMode('mastered')">
      <span class="mode-count" id="num-mastered" style="color: var(--green);">0</span>
      <span>😎 已封印</span>
    </button>
    <button class="mode-btn" id="m-report" onclick="switchMode('report')">
      <span class="mode-count">📊</span>
      <span>學習紀錄</span>
    </button>
  </div>

  <!-- Filter Dropdowns -->
  <div class="filter-row" id="filter-bar">
    <select class="select-box" id="pack-select" onchange="onFilterChange()">
      <option value="all">📅 全部考試進度 (40)</option>
      <option value="lichi_1025">🔥 李奇 10/25 小考 (16)</option>
      <option value="lichi_1018">⚡ 李奇 10/18 小考 (12)</option>
      <option value="midterm1">🏫 一中一段核心 (12)</option>
    </select>
    <select class="select-box" id="cat-select" onchange="onFilterChange()">
      <option value="all">🎯 全部弱點類型</option>
      <option value="roots">🧩 字根樂高 (新聞字)</option>
      <option value="phonics">🔤 音節拼讀 (防拼錯)</option>
      <option value="chunks">🔗 黃金語塊 (搭配詞)</option>
      <option value="grammar">⚡ 文法時態秒殺</option>
    </select>
  </div>

  <!-- MAIN SINGLE-CARD STAGE -->
  <div id="deck-view">
    <div class="progress-wrap">
      <div class="progress-info">
        <span id="deck-label">目前卡堆：🔥 待消滅清單</span>
        <span id="deck-counter">第 1 / 1 張</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="deck-progress" style="width: 0%;"></div>
      </div>
    </div>

    <div id="single-card-mount"></div>

    <div class="nav-bar" id="nav-bar">
      <button class="nav-btn" onclick="stepCard(-1)">⬅️ 上一張</button>
      <span style="font-size: 0.76rem; color: var(--text-sub);">選對意思才可解鎖「😎 封印」</span>
      <button class="nav-btn" onclick="stepCard(1)">下一張 ➡️</button>
    </div>
  </div>

  <!-- REPORT & AI SYNC VIEW -->
  <div id="report-view" style="display: none;">
    <div class="report-card">
      <h3 style="font-size: 1rem; margin-bottom: 4px;">📊 真實熟練度＆防亂點檢測報告</h3>
      <p style="font-size: 0.8rem; color: var(--text-sub);">
        系統自動記錄每次微測試的「首次點擊正確率」與「思考秒數」，並同步給 AI 規劃下週重點。
      </p>
      <div class="stat-grid" id="report-metrics"></div>
      <div id="sos-word-list" style="font-size: 0.84rem; background: #FAF9F6; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); margin-bottom: 12px;"></div>

      <button class="full-btn primary" onclick="forceSync(true)">☁️ 立即同步最新紀錄至雲端</button>
      <button class="full-btn" onclick="copyReport()">📋 複製學習戰報文字 (傳給爸媽 / AI)</button>
      <button class="full-btn" onclick="downloadCSV()">📥 下載 Excel 試算表紀錄 (.csv)</button>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    // ============================================================================
    // 1. FLASHCARD DATABASE (With Short Meaning for 3-Option Gate Test)
    // ============================================================================
    const CARDS_DB = [
      // 李奇 10/25 (16 Cards)
      { id: "c_1025_01", pack: "lichi_1025", packName: "李奇 10/25", cat: "roots", catName: "🧩 字根樂高", word: "undermine", syllable: "un · der · mine", shortAns: "暗中削弱、損害（信任或根基）", meaning: "v. 暗中削弱、損害（信任／威信／基礎）", hack: "<b>under</b>（在下面）+ <b>mine</b>（挖地道/地雷）➔ 從底部暗中挖空削弱！", example: "Spreading rumors will undermine public trust. (Q17/Q38)" },

      { id: "c_1025_04", pack: "lichi_1025", packName: "李奇 10/25", cat: "chunks", catName: "🔗 黃金語塊", word: "YouTube personalities", syllable: "per · son · al · i · ties", shortAns: "知名網紅、風雲人物、名人", meaning: "n. 知名網紅、風雲人物、公眾名人", hack: "<b>熟詞生義</b>：personality 單數是個性，複數 <b>personalities</b> 指「名人、網紅」，絕非傀儡！", example: "Many famous YouTube personalities were invited to the launch. (Q27)" },

      { id: "c_1025_09", pack: "lichi_1025", packName: "李奇 10/25", cat: "roots", catName: "🧩 字根樂高", word: "decline", syllable: "de · cline", shortAns: "下滑、衰退；婉拒", meaning: "v./n. 下滑、衰退；婉拒", hack: "<b>de-</b>（向下）+ <b>cline</b>（傾斜）➔ 往下傾斜 ➔ 分數下滑、衰退！", example: "Test scores have declined in those districts. (Q33)" },

    // ============================================================================
    // 2. STATE & ANTI-BLIND-CLICK TRACKING
    // ============================================================================
    const STORAGE_KEY = "gordon_en_sniper_state_v2";
    const CLOUD_TOPIC = "gordon_en_sniper_d72b5fa7";

    let appState = {
      student: "Gordon",
      lastUpdated: new Date().toISOString(),
      stats: { totalAttempts: 0, firstTryCorrect: 0, fastClickWarnings: 0 },
      cards: {}
    };

    let currentMode = "todo"; // 'todo' | 'sos' | 'mastered' | 'report'
    let filteredDeck = [];
    let currentIndex = 0;
    let cardShownTime = 0;

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          appState = { ...appState, ...parsed };
          if (!appState.stats) appState.stats = { totalAttempts: 0, firstTryCorrect: 0, fastClickWarnings: 0 };
        }
      } catch (e) {}

      CARDS_DB.forEach(c => {
        if (!appState.cards[c.id]) {
          appState.cards[c.id] = { status: "new", errCount: 0, passCount: 0, avgMs: 0, updatedAt: "" };
        }
      });
    }

    function saveState(syncCloud = true) {
      appState.lastUpdated = new Date().toISOString();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
      updateModeCounts();
      if (syncCloud) triggerCloudSync();
    }

    let syncTimer = null;
    function triggerCloudSync() {
      const pill = document.getElementById("sync-status");
      pill.innerText = "🔄 同步中...";
      if (syncTimer) clearTimeout(syncTimer);
      syncTimer = setTimeout(async () => {
        try {
          const payload = buildSyncPayload();
          await fetch(`https://ntfy.sh/${CLOUD_TOPIC}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
          pill.innerText = "☁️ 雲端已同步";
        } catch (e) {
          pill.innerText = "💾 已存手機";
        }
      }, 500);
    }

    function buildSyncPayload() {
      const summary = { mastered: [], review: [], sos: [], errCards: {} };
      CARDS_DB.forEach(c => {
        const st = appState.cards[c.id] || { status: "new", errCount: 0 };
        if (st.status === "mastered") summary.mastered.push(c.word);
        if (st.status === "review") summary.review.push(c.word);
        if (st.status === "sos") summary.sos.push(c.word);
        if (st.errCount > 0) summary.errCards[c.word] = st.errCount;
      });
      return {
        type: "gordon_state_sync",
        timestamp: new Date().toISOString(),
        stats: appState.stats,
        summary,
        cards: appState.cards
      };
    }

    function forceSync(notify = false) {
      triggerCloudSync();
      if (notify) showToast("☁️ 已同步最新學習紀錄至雲端！");
    }

    // ============================================================================
    // 3. SINGLE-CARD DECK ENGINE & MICRO-TEST GATE
    // ============================================================================
    function updateModeCounts() {
      const pack = document.getElementById("pack-select").value;
      const cat = document.getElementById("cat-select").value;
      let todo = 0, sos = 0, mastered = 0;

      CARDS_DB.forEach(c => {
        if (pack !== "all" && c.pack !== pack) return;
        if (cat !== "all" && c.cat !== cat) return;
        const st = (appState.cards[c.id] && appState.cards[c.id].status) || "new";
        if (st === "mastered") mastered++;
        else {
          todo++;
          if (st === "sos") sos++;
        }
      });

      document.getElementById("num-todo").innerText = todo;
      document.getElementById("num-sos").innerText = sos;
      document.getElementById("num-mastered").innerText = mastered;
    }

    function rebuildDeck() {
      updateModeCounts();
      const pack = document.getElementById("pack-select").value;
      const cat = document.getElementById("cat-select").value;

      filteredDeck = CARDS_DB.filter(c => {
        if (pack !== "all" && c.pack !== pack) return false;
        if (cat !== "all" && c.cat !== cat) return false;
        const st = (appState.cards[c.id] && appState.cards[c.id].status) || "new";
        if (currentMode === "todo") return st !== "mastered";
        if (currentMode === "sos") return st === "sos";
        if (currentMode === "mastered") return st === "mastered";
        return true;
      });

      if (currentIndex >= filteredDeck.length) currentIndex = 0;
      renderSingleCard();
    }

    function getThreeOptionsForCard(targetCard) {
      // Pick 2 distractors from same category or pack
      const pool = CARDS_DB.filter(c => c.id !== targetCard.id);
      const shuffledPool = pool.sort(() => Math.random() - 0.5);
      const distractors = shuffledPool.slice(0, 2).map(x => ({ text: x.shortAns, isCorrect: false }));
      const opts = [{ text: targetCard.shortAns, isCorrect: true }, ...distractors];
      return opts.sort(() => Math.random() - 0.5);
    }

    function renderSingleCard() {
      const mount = document.getElementById("single-card-mount");
      const navBar = document.getElementById("nav-bar");
      const labelMap = {
        todo: "🔥 待消滅清單（答對解鎖封印）",
        sos: "🛏️ 睡前急救室（只看死穴字）",
        mastered: "😎 已封印庫（複習檢視）"
      };
      document.getElementById("deck-label").innerText = labelMap[currentMode] || "";

      if (filteredDeck.length === 0) {
        document.getElementById("deck-counter").innerText = "0 / 0 張";
        document.getElementById("deck-progress").style.width = "100%";
        navBar.style.display = "none";
        let emptyTitle = "🎉 太棒了！這個範圍的單字已經全部封印完成！";
        if (currentMode === "sos") emptyTitle = "✨ 目前「🛏️ 睡前急救室」是空的，沒有卡住的單字！";
        if (currentMode === "mastered") emptyTitle = "目前還沒有封印的單字，快去「🔥 待消滅」闖關吧！";

        mount.innerHTML = `
          <div class="card-stage" style="justify-content: center; align-items: center; text-align: center; min-height: 280px;">
            <div style="font-size: 2.2rem; margin-bottom: 10px;">🌿</div>
            <h3 style="margin-bottom: 8px;">${emptyTitle}</h3>
            <p style="font-size: 0.85rem; color: var(--text-sub);">可從上方切換其他考試進度或分類繼續練習。</p>
          </div>
        `;
        return;
      }

      navBar.style.display = "flex";
      const card = filteredDeck[currentIndex];
      const stObj = appState.cards[card.id] || { status: "new", errCount: 0 };
      const total = filteredDeck.length;
      document.getElementById("deck-counter").innerText = `第 ${currentIndex + 1} / ${total} 張`;
      document.getElementById("deck-progress").style.width = `${Math.round(((currentIndex + 1) / total) * 100)}%`;

      const options = getThreeOptionsForCard(card);
      cardShownTime = Date.now();

      const stBadge =
        stObj.status === "sos" ? "🆘 睡前急救死穴" :
        stObj.status === "review" ? "🤔 明天再考" :
        stObj.status === "mastered" ? "😎 已封印" : "🆕 待闖關";

      mount.innerHTML = `
        <div class="card-stage">
          <div>
            <div class="card-meta-row">
              <span class="meta-tag">${card.packName} · ${card.catName}</span>
              <span class="status-tag">${stBadge} ${stObj.errCount > 0 ? `(曾錯 ${stObj.errCount} 次)` : ""}</span>
            </div>

            <div class="word-hero">
              <div class="word-main">${card.word}</div>
              <div class="word-syllable">🗣️ ${card.syllable}</div>
              <button class="audio-btn" onclick="speakText('${card.word.replace(/'/g, "\\'")}')">🔊 點此聽發音並跟讀</button>
            </div>
          </div>

          <!-- STEP 1: MICRO-TEST GATE -->
          <div id="gate-box">
            <div class="gate-title">👇 請點選正確意思（選對才可解鎖「😎 封印」）：</div>
            <div class="opt-list">
              ${options.map((o, idx) => `
                <button class="opt-btn" onclick="verifyGate(${o.isCorrect})">
                  (${String.fromCharCode(65 + idx)}) ${o.text}
                </button>
              `).join("")}
            </div>
            <button class="unsure-btn" onclick="verifyGate(false, true)">🤔 我還不熟，直接翻面看字根解析</button>
          </div>

          <!-- STEP 2: REVEALED EXPLANATION & CONSEQUENCES -->
          <div id="reveal-box" class="reveal-box">
            <div id="gate-result-banner" class="result-banner"></div>
            <div class="meaning-title">${card.meaning}</div>
            <div class="hack-card">🧠 <b>秒懂拆解：</b>${card.hack}</div>
            <div class="example-line">📝 <b>考卷真題：</b>${card.example}</div>
            <div id="conseq-actions" class="action-group"></div>
          </div>
        </div>
      `;
    }

    function verifyGate(isCorrect, isUnsure = false) {
      const elapsedMs = Date.now() - cardShownTime;
      const card = filteredDeck[currentIndex];
      const stObj = appState.cards[card.id];

      // Anti-blind-click speed check (< 650ms and wrong)
      if (!isUnsure && elapsedMs < 650 && !isCorrect) {
        appState.stats.fastClickWarnings = (appState.stats.fastClickWarnings || 0) + 1;
        showToast("⏳ 點太快囉！先看清楚音節與字根再選～");
      }

      appState.stats.totalAttempts = (appState.stats.totalAttempts || 0) + 1;
      stObj.avgMs = stObj.avgMs ? Math.round((stObj.avgMs + elapsedMs) / 2) : elapsedMs;

      document.getElementById("gate-box").style.display = "none";
      const revealBox = document.getElementById("reveal-box");
      const banner = document.getElementById("gate-result-banner");
      const actions = document.getElementById("conseq-actions");
      revealBox.style.display = "block";

      if (isCorrect) {
        appState.stats.firstTryCorrect = (appState.stats.firstTryCorrect || 0) + 1;
        stObj.passCount = (stObj.passCount || 0) + 1;
        saveState(true);

        banner.className = "result-banner pass";
        banner.innerText = "✅ 答對了！你已解鎖「😎 秒懂封印」權限！";

        actions.innerHTML = `
          <button class="conseq-btn btn-seal" onclick="applyDecision('${card.id}', 'mastered')">
            <div>
              <span class="c-main">😎 秒懂！封印這張卡</span>
              <span class="c-sub">➔ 結果：從待背清單消失（待背數 -1），跳下一張</span>
            </div>
            <span class="c-arrow">➔</span>
          </button>
          <button class="conseq-btn btn-keep" onclick="applyDecision('${card.id}', 'review')">
            <div>
              <span class="c-main">🤔 剛剛有點猶豫，明天再考我一次</span>
              <span class="c-sub">➔ 結果：留在日常清單，跳下一張</span>
            </div>
            <span class="c-arrow">➔</span>
          </button>
        `;
      } else {
        // Wrong or Unsure -> Lock "Seal" button, auto-record error & send to SOS
        stObj.errCount = (stObj.errCount || 0) + 1;
        stObj.status = "sos";
        stObj.updatedAt = new Date().toISOString();
        saveState(true);

        banner.className = "result-banner fail";
        banner.innerText = isUnsure
          ? "💡 誠實面對不熟的字最棒！看懂下方拆解就記住囉（本次鎖定封印）"
          : "❌ 選錯囉！本次鎖定「封印」，系統已自動加入【🛏️ 睡前急救室】";

        actions.innerHTML = `
          <button class="conseq-btn btn-sos" onclick="applyDecision('${card.id}', 'sos')">
            <div>
              <span class="c-main">🛏️ 看懂拆解了！放進睡前急救室換下一張</span>
              <span class="c-sub">➔ 結果：收進上方「睡前急救(🆘)」，AI 下週幫你換口訣特訓</span>
            </div>
            <span class="c-arrow">➔</span>
          </button>
        `;
      }
    }

    function applyDecision(cardId, newStatus) {
      const card = CARDS_DB.find(c => c.id === cardId);
      appState.cards[cardId].status = newStatus;
      appState.cards[cardId].updatedAt = new Date().toISOString();
      saveState(true);

      if (newStatus === "mastered") {
        showToast(`😎 已封印「${card.word}」！待消滅卡片 -1`);
        rebuildDeck(); // Card disappears from todo deck automatically
      } else {
        // Move to next card
        if (currentIndex < filteredDeck.length - 1) {
          currentIndex++;
        } else {
          currentIndex = 0;
        }
        rebuildDeck();
      }
    }

    function stepCard(delta) {
      if (filteredDeck.length === 0) return;
      currentIndex = (currentIndex + delta + filteredDeck.length) % filteredDeck.length;
      renderSingleCard();
    }

    function switchMode(mode) {
      currentMode = mode;
      ["todo", "sos", "mastered", "report"].forEach(m => {
        document.getElementById(`m-${m}`).classList.toggle("active", m === mode);
      });

      const isReport = (mode === "report");
      document.getElementById("deck-view").style.display = isReport ? "none" : "block";
      document.getElementById("filter-bar").style.display = isReport ? "none" : "grid";
      document.getElementById("report-view").style.display = isReport ? "block" : "none";

      if (isReport) {
        renderReportView();
      } else {
        currentIndex = 0;
        rebuildDeck();
      }
    }

    function onFilterChange() {
      currentIndex = 0;
      rebuildDeck();
    }

    function speakText(text) {
      const clean = text.replace(/vs\.|\.\.\.|\/|\+/g, " ");
      if ("speechSynthesis" in window) {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(clean);
        u.lang = "en-US";
        u.rate = 0.9;
        window.speechSynthesis.speak(u);
      }
    }

    // ============================================================================
    // 4. PARENT / AI VERIFICATION REPORT
    // ============================================================================
    function renderReportView() {
      const mastered = [], review = [], sos = [];
      CARDS_DB.forEach(c => {
        const st = (appState.cards[c.id] && appState.cards[c.id].status) || "new";
        if (st === "mastered") mastered.push(c.word);
        if (st === "review") review.push(c.word);
        if (st === "sos") sos.push(`${c.word} (${c.packName})`);
      });

      const attempts = appState.stats.totalAttempts || 0;
      const correct = appState.stats.firstTryCorrect || 0;
      const acc = attempts > 0 ? Math.round((correct / attempts) * 100) : 0;

      document.getElementById("report-metrics").innerHTML = `
        <div class="stat-item">
          <div class="stat-item-val" style="color: var(--green);">${mastered.length} / ${CARDS_DB.length}</div>
          <div class="stat-item-lbl">😎 通過測試已封印</div>
        </div>
        <div class="stat-item">
          <div class="stat-item-val">${acc}% (${correct}/${attempts})</div>
          <div class="stat-item-lbl">🎯 微測試首次命中率</div>
        </div>
        <div class="stat-item">
          <div class="stat-item-val" style="color: var(--red);">${sos.length} 張</div>
          <div class="stat-item-lbl">🛏️ 睡前急救死穴卡</div>
        </div>
        <div class="stat-item">
          <div class="stat-item-val" style="color: var(--amber);">${appState.stats.fastClickWarnings || 0} 次</div>
          <div class="stat-item-lbl">⏳ 防秒按亂猜攔截</div>
        </div>
      `;

      document.getElementById("sos-word-list").innerHTML = `
        <div style="margin-bottom: 6px;"><b>🆘 目前在「睡前急救室」的重點單字：</b><br>${sos.length ? sos.join("、") : "✨ 目前無死穴單字"}</div>
        <div style="color: var(--text-sub); font-size: 0.78rem;"><b>😎 已驗證封印單字：</b>${mastered.length ? mastered.join(", ") : "尚無"}</div>
      `;
    }

    function copyReport() {
      const p = buildSyncPayload();
      const attempts = appState.stats.totalAttempts || 0;
      const correct = appState.stats.firstTryCorrect || 0;
      const acc = attempts > 0 ? Math.round((correct / attempts) * 100) : 0;

      const text = [
        `【🌿 Gordon 英文閃卡真偽檢測戰報】`,
        `時間：${new Date().toLocaleString("zh-TW")}`,
        `🎯 微測試首次命中率：${acc}% (${correct}/${attempts} 次)`,
        `😎 已驗證封印 (${p.summary.mastered.length}字)：${p.summary.mastered.join(", ") || "無"}`,
        `🤔 明天再考 (${p.summary.review.length}字)：${p.summary.review.join(", ") || "無"}`,
        `🆘 睡前急救死穴 (${p.summary.sos.length}字)：${p.summary.sos.join(", ") || "無"}`
      ].join("\n");

      navigator.clipboard.writeText(text).then(() => {
        showToast("📋 已複製學習戰報文字！");
      });
    }

    function downloadCSV() {
      const rows = [["卡片ID", "考試進度", "弱點分類", "英文單字", "音節", "中文意義", "目前狀態", "答錯次數", "平均思考毫秒", "最後更新時間"]];
      CARDS_DB.forEach(c => {
        const st = appState.cards[c.id] || { status: "new", errCount: 0, avgMs: 0, updatedAt: "" };
        rows.push([c.id, c.packName, c.catName, `"${c.word}"`, `"${c.syllable}"`, `"${c.meaning}"`, st.status, st.errCount || 0, st.avgMs || 0, st.updatedAt || ""]);
      });
      const csv = "\uFEFF" + rows.map(r => r.join(",")).join("\n");
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "Gordon_閃卡學習狀態總表.csv";
      a.click();
    }

    let toastTimer = null;
    function showToast(msg) {
      const t = document.getElementById("toast");
      t.innerText = msg;
      t.style.display = "block";
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { t.style.display = "none"; }, 2800);
    }

    window.onload = () => {
      loadState();
      rebuildDeck();
    };
  </script>
</body>
</html>
